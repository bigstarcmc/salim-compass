<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="살림나침반">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>살림나침반</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#FBF8F2; --surface:#FFFFFF; --border:#ECE3D2;
  --ink:#1B2A4A; --ink-soft:#5B6B8C; --ink-mute:#93A0BC;
  --gold:#C9922E; --gold-deep:#8B6914; --gold-soft:#F4E7CB;
  --success:#3F7D58; --danger:#B4423D;
  --day:#E4A93B; --night:#2A3B6B; --off:#C9C2B4;
  --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Pretendard',-apple-system,sans-serif; -webkit-font-smoothing:antialiased;}
body{padding-bottom:78px; min-height:100vh;}
button,input,select,textarea{font-family:inherit;}

/* ---------- Top bar ---------- */
.topbar{position:sticky; top:0; z-index:20; background:var(--ink); color:#fff;
  padding:14px 18px 16px; display:flex; align-items:center; justify-content:space-between;
  border-radius:0 0 22px 22px;}
.topbar .brand{display:flex; align-items:center; gap:8px;}
.topbar .compass{font-size:22px; display:inline-block;}
.topbar .pageTitle{font-size:17px; font-weight:700; letter-spacing:-.2px;}
.topbar .who{font-size:12px; background:rgba(255,255,255,.14); padding:6px 12px; border-radius:20px; cursor:pointer; border:none; color:#fff;}

.scopeBar{position:sticky; top:0; z-index:19; display:flex; gap:8px; padding:10px 16px; background:var(--bg);}
.scopeBtn{flex:1; padding:10px 6px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface);
  font-size:13px; font-weight:700; color:var(--ink-soft);}
.scopeBtn.active{background:var(--gold); border-color:var(--gold); color:#fff;}
.scopeBtn[data-s="shared"].active{background:var(--ink); border-color:var(--ink);}

/* ---------- Bottom nav ---------- */
.bottomNav{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface);
  border-top:1px solid var(--border); display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.navBtn{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center;
  gap:2px; padding:6px 2px; color:var(--ink-mute); font-size:10px; font-weight:600; border-radius:12px;}
.navBtn .navIcon{font-size:20px;}
.navBtn.active{color:var(--gold-deep);}
.navBtn.active .navIcon{transform:scale(1.08);}

/* ---------- Content ---------- */
main{padding:16px 16px 24px; max-width:480px; margin:0 auto;}
.view{display:none;}
.view.active{display:block; animation:fadeUp .25s ease;}
@keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:16px; margin-bottom:12px;}
.cardHero{background:var(--ink); color:#fff; border-radius:var(--radius-lg); padding:22px 20px; margin-bottom:14px;
  position:relative; overflow:hidden;}
.cardHero::after{content:"🧭"; position:absolute; right:-10px; bottom:-18px; font-size:110px; opacity:.08;}
.cardTitle{font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:10px;}
.heroLabel{font-size:12px; opacity:.75; margin-bottom:6px;}
.heroNumber{font-size:32px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums;}
.heroSub{font-size:12px; opacity:.8; margin-top:6px;}

.muted{color:var(--ink-mute); font-size:12px;}
.rowLine{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #F4EFE3; font-size:14px;}
.rowLine:last-child{border-bottom:none;}
.rowLine .amt{font-weight:700; font-variant-numeric:tabular-nums;}
/* 설정 화면의 목록 줄(계좌/카드/카테고리/고정지출 등): 알록달록한 버튼 대신 작은 아이콘으로
 * 수정/삭제/복사를 표시해서 전체 디자인 톤(담백한 카드+텍스트 위주)과 어울리게 함. */
.listRow{padding:10px 0; border-bottom:1px solid #F4EFE3;}
.listRow:last-child{border-bottom:none;}
.listRow .listMain{display:flex; justify-content:space-between; align-items:center; font-size:14px; gap:8px;}
.listRow .listSub{display:flex; justify-content:space-between; align-items:center; margin-top:3px;}
.iconBtn{font-size:14px; cursor:pointer; opacity:.55; padding:2px 3px;}
.iconBtn.danger{opacity:.7;}
.iconActions{display:flex; gap:10px; align-items:center; flex:0 0 auto;}
/* 거래/이체 목록: 글자가 길어져도 절대 다음 줄로 안 넘어가고 한 줄 안에서 말줄임표(...)로
 * 잘리게 한다. 아이콘·날짜는 맨 왼쪽에 작게 고정, 금액·수정아이콘은 맨 오른쪽에 고정폭으로
 * 고정해서 글자 길이와 무관하게 항상 같은 자리에 있다. */
.txnRowLine{display:flex; align-items:center; gap:6px; padding:10px 0; border-bottom:1px solid #F4EFE3; font-size:13px; cursor:pointer;}
.txnRowLine:last-child{border-bottom:none;}
.txnRowLine .txnIcon{flex:0 0 auto; font-size:14px; width:18px; text-align:center;}
.txnRowLine .txnDate{flex:0 0 auto; font-size:10px; color:var(--ink-mute); width:32px; line-height:1.3;}
.txnRowLine .txnText{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.txnRowLine .txnAmt{flex:0 0 auto; font-weight:700; font-variant-numeric:tabular-nums; margin-left:2px;}
.txnRowLine .txnEdit{flex:0 0 auto; font-size:11px; opacity:.45; margin-left:1px;}
.txnRowLine .txnPending{flex:0 0 auto; font-size:10px; margin-left:1px;}

.pillTabs{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto;}
.pill{flex:0 0 auto; padding:8px 16px; border-radius:20px; border:1px solid var(--border); background:var(--surface);
  color:var(--ink-soft); font-size:13px; font-weight:600;}
.pill.active{background:var(--ink); color:#fff; border-color:var(--ink);}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:var(--radius-sm);
  padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer; width:100%;}
.btn-gold{background:var(--gold); color:#fff;}
.btn-ghost{background:var(--gold-soft); color:var(--gold-deep);}
.btn-danger{background:#F6E3E1; color:var(--danger);}
.btn-sm{width:auto; padding:7px 12px; font-size:12px; border-radius:8px;}

.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
.field input, .field select{width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:10px;
  background:#fff; font-size:14px; color:var(--ink);}
.field input[type=checkbox]{width:auto;}

.barTrack{background:#F0EAD9; border-radius:6px; height:10px; overflow:hidden; margin:6px 0;}
.barFill{height:100%; border-radius:6px;}

/* ---------- Calendar ---------- */
.calHead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.calHead button{background:var(--surface); border:1px solid var(--border); border-radius:10px; width:36px; height:36px; font-size:16px;}
.calHead .ym{font-weight:800; font-size:16px;}
.weekRow{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--ink-mute); margin-bottom:4px;}
.dayGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.dayCell{position:relative; min-height:64px; border-radius:14px; display:flex; align-items:flex-start; justify-content:flex-start;
  padding:6px; cursor:pointer; border:1px solid rgba(0,0,0,.06);}
.dayCell .num{font-size:13px; font-weight:800;}
.dayCell .badge{position:absolute; bottom:5px; right:5px; min-width:22px; height:22px; padding:0 5px; border-radius:11px;
  font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; color:#fff;}
.dayCell.today{outline:2px solid var(--ink);}
.today{outline:2px solid var(--ink);}
.bg-주{background:#FBF0D3;} .bg-야{background:#E6E9F5;} .bg-휴{background:#F5F3EC;}
.b-주{background:var(--day); color:#4A3200;} .b-야{background:var(--night);} .b-휴{background:transparent; color:var(--danger); font-size:10px;}
.b-휴가{background:#3BA36A;} .b-대근주간{background:#C026D3;} .b-대근야간{background:#581C87;} .b-지정휴무{background:#0D9488;}
.b-교육{background:#2F6FED;} .b-건강검진{background:#0E93A8;} .b-개인일정{background:#6B7280;}

/* 달력 칸에는 글씨를 최소로만 넣는다 — 휴가/대근만 글자로 눈에 띄고,
   나머지 일정은 색 점으로만 표시하고 내용은 날짜를 눌러서 본다. */
.dayCell .dots{position:absolute; bottom:5px; left:5px; display:flex; gap:4px; align-items:center;}
/* 점이 배경에 묻히지 않게: 조금 키우고, 흰 테두리 + 옅은 그림자를 둘러서 어두운 색도 떠 보이게 하고,
   아주 약하게(꺼지지는 않을 만큼) 숨쉬듯 깜빡이게 한다. 여러 개면 살짝씩 시차를 준다. */
.dayCell .evDot{width:8px; height:8px; border-radius:50%; display:block;
  border:1.5px solid rgba(255,255,255,.95); box-shadow:0 1px 2px rgba(27,42,74,.35);
  animation:softPulse 2.4s ease-in-out infinite;}
.dayCell .evDot:nth-child(2){animation-delay:.5s;}
.dayCell .evDot:nth-child(3){animation-delay:1s;}
.dayCell .evMore{font-size:9px; font-weight:800; color:var(--ink-soft); line-height:1;}
@keyframes softPulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.55; transform:scale(.84);}}

/* 중요도 표시 — 글씨 없이 색으로만. 빨강=꼭 챙길 일, 주황=한 번 보고 넘어갈 일. */
.dotImp{position:absolute; top:5px; right:5px; width:9px; height:9px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.9);}
.dotImp.high{background:#E8452C; animation:blinkHigh 1.2s infinite;}
.dotImp.mid{background:#F08A24; animation:blinkMid 2s ease-in-out infinite;}
@keyframes blinkHigh{0%{opacity:1; box-shadow:0 0 0 0 rgba(232,69,44,.6);}
  70%{opacity:.35; box-shadow:0 0 0 7px rgba(232,69,44,0);}
  100%{opacity:1; box-shadow:0 0 0 0 rgba(232,69,44,0);}}
@keyframes blinkMid{0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(240,138,36,.55);}
  60%{opacity:.5; box-shadow:0 0 0 6px rgba(240,138,36,0);}}

.itemRow{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid #F4EFE3; font-size:14px;}
.itemRow:last-child{border-bottom:none;}
.itemActions{display:flex; gap:6px; flex:0 0 auto;}
.typeChip{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:800; color:#fff; margin-right:6px;}

.myTeamChip{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--gold-soft); color:var(--gold-deep);
  padding:10px 14px; border-radius:14px; font-weight:700; font-size:12px; margin-bottom:12px;}
.myTeamChip b{color:var(--ink);}

/* ---------- Bottom sheet modal ---------- */
.sheetOverlay{position:fixed; inset:0; background:rgba(27,42,74,.5); z-index:50; display:none;}
.sheetOverlay.open{display:block;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--surface);
  border-radius:22px 22px 0 0; max-height:85vh; overflow-y:auto; transform:translateY(100%); transition:transform .25s ease;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));}
.sheetOverlay.open .sheet{transform:translateY(0);}
.sheetHandle{width:40px; height:4px; background:var(--border); border-radius:2px; margin:10px auto;}
.sheetHead{display:flex; justify-content:space-between; align-items:center; padding:2px 20px 10px;}
.sheetHead h3{margin:0; font-size:16px;}
.sheetHead button{background:none; border:none; font-size:18px; color:var(--ink-mute);}
.sheetBody{padding:0 20px 10px;}

.segTabs{display:flex; gap:6px; margin:10px 0 14px;}
.segBtn{flex:1; padding:9px; border-radius:10px; border:1px solid var(--border); background:#fff; font-size:12px; font-weight:700; color:var(--ink-soft);}
.segBtn.active{background:var(--ink); color:#fff; border-color:var(--ink);}

.emptyState{text-align:center; padding:30px 10px; color:var(--ink-mute); font-size:13px;}

.setupOverlay{position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; align-items:center; padding:24px;}
.setupBox{width:100%; max-width:400px; margin:0 auto;}
.setupBox h1{font-size:24px; margin:0 0 6px;}
.setupBox p{color:var(--ink-soft); font-size:13px; margin-bottom:20px; line-height:1.6;}
.err{color:var(--danger); font-size:12px; margin-top:6px; min-height:16px;}
</style>
</head>
<body>

<div class="setupOverlay" id="setupOverlay">
  <div class="setupBox">
    <h1>🧭 살림나침반</h1>
    <p>비밀번호를 입력하면 들어갈 수 있어요.</p>
    <div class="field"><label>비밀번호</label><input id="setupKey" type="password" onkeydown="if(event.key==='Enter')doUnlock()"></div>
    <button class="btn btn-gold" onclick="doUnlock()">입장하기</button>
    <div class="err" id="setupErr"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <header class="topbar">
    <div class="brand"><span class="compass">🧭</span><span class="pageTitle" id="pageTitle">홈</span></div>
  </header>
  <div class="scopeBar" id="scopeBar"></div>

  <main>
    <div class="view active" id="view-home"></div>
    <div class="view" id="view-calendar"></div>
    <div class="view" id="view-payroll"></div>
    <div class="view" id="view-ledger"></div>
    <div class="view" id="view-savings"></div>
    <div class="view" id="view-settings"></div>
  </main>

  <nav class="bottomNav">
    <button class="navBtn active" data-v="home" onclick="switchView('home')"><span class="navIcon">🏠</span><span>홈</span></button>
    <button class="navBtn" data-v="calendar" onclick="switchView('calendar')"><span class="navIcon">📅</span><span>캘린더</span></button>
    <button class="navBtn" data-v="payroll" onclick="switchView('payroll')"><span class="navIcon">💰</span><span>급여</span></button>
    <button class="navBtn" data-v="ledger" onclick="switchView('ledger')"><span class="navIcon">📒</span><span>가계부</span></button>
    <button class="navBtn" data-v="savings" onclick="switchView('savings')"><span class="navIcon">🎯</span><span>저축</span></button>
    <button class="navBtn" data-v="settings" onclick="switchView('settings')"><span class="navIcon">⚙️</span><span>설정</span></button>
  </nav>
</div>

<div class="sheetOverlay" id="sheetOverlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <div class="sheetHandle"></div>
    <div class="sheetHead"><h3 id="sheetTitle"></h3><button onclick="closeSheet()">✕</button></div>
    <div class="sheetBody" id="sheetBody"></div>
  </div>
</div>

<script>
/* ================= 설정/연결 ================= */
// 웹앱 URL과 API 키는 고정값으로 박아둠 — 아무도 다시 입력할 필요 없음.
const BAKED_IN_URL = 'https://script.google.com/macros/s/AKfycbyV7YUQU_1u3Vawe0gSC8AB07fE9lbUrT8xI229gj7UD-OOM4sbAIzk113e25C9ETmI/exec';
const BAKED_IN_KEY = 'salim-compass-2026-jh';
const APP_PASSWORD = '1080019jh!'; // 간단한 잠금용 — 이 값 하나만 맞으면 들어옴(대단한 보안이 필요한 앱은 아니라서)

const UNLOCK_KEY = 'salimCompassUnlocked';
const SCOPE_KEY = 'salimCompassScope';
let CFG = { url: BAKED_IN_URL, key: BAKED_IN_KEY };
let PROFILES = [];
let SCOPE = localStorage.getItem(SCOPE_KEY) || 'shared'; // 'shared' | ProfileID

function doUnlock() {
  const pw = document.getElementById('setupKey').value;
  const err = document.getElementById('setupErr');
  if (pw !== APP_PASSWORD) { err.innerText = '비밀번호가 올바르지 않아요.'; return; }
  localStorage.setItem(UNLOCK_KEY, 'yes');
  startApp();
}

// fetch/JSON 파싱이 어떤 이유로든 실패해도 절대 그냥 멈추지 않고, 항상 {success:false, message} 형태로 돌려줌.
// (예전엔 여기서 에러가 나면 화면이 "불러오는 중..."에서 영원히 안 넘어가는 문제가 있었음 — 그 문제를 근본적으로 막는 부분)
async function callApiRaw(url, key, action, args) {
  let res;
  try {
    const u = url + '?action=' + encodeURIComponent(action) + '&key=' + encodeURIComponent(key) + '&args=' + encodeURIComponent(JSON.stringify(args));
    res = await fetch(u);
  } catch (e) {
    return { success: false, message: '네트워크 오류: ' + e.message };
  }
  let text;
  try { text = await res.text(); } catch (e) { return { success: false, message: '응답을 읽지 못했어요.' }; }
  try { return JSON.parse(text); }
  catch (e) { return { success: false, message: '서버 응답이 JSON이 아니에요(배포 재확인 필요): ' + text.slice(0, 150) }; }
}
async function api(action, args = []) {
  try {
    const res = await callApiRaw(CFG.url, CFG.key, action, args);
    if (res && res.success) {
      if (API_CACHE_WRITE_ACTIONS.test(action)) {
        // 방금 쓴 내용이 반영되기 전의 캐시된 화면이 잠깐이라도 먼저 보이는 걸 막기 위해,
        // 쓰기가 성공하면 어떤 조회 캐시가 영향받는지 일일이 따지지 않고 전체를 비운다.
        // (그 다음 조회 1번은 캐시 없이 서버를 기다리게 되지만, 방금 액션을 실행한 직후이니
        // 그 정도 기다림은 자연스럽다 — "내가 방금 한 게 반영 안 됐나?" 하는 혼란보다 낫다.)
        _clearApiCache();
      } else {
        _writeApiCache(action, args, res.data);
      }
    }
    return res;
  }
  catch (e) { return { success: false, message: '알 수 없는 오류: ' + e.message }; }
}

/* ================= API 응답 캐시 (cache-first 렌더링) =================
 * 목적: 화면을 열 때마다 서버 왕복(Apps Script는 구조상 요청당 보통 1초 안팎 걸림)을
 * 눈으로 보며 기다리지 않도록, "마지막으로 성공했던 응답"을 localStorage에 저장해두고
 * 화면을 열자마자 그걸로 먼저 그린 다음, 그 사이 최신 데이터를 백그라운드로 받아와서
 * 다시 그린다. 실제 서버 응답속도는 그대로지만 체감 속도는 크게 좋아진다.
 * - add/update/delete/confirm/apply/close/settle/create/adjust/set/init 로 시작하는
 *   "쓰기" 액션은 절대 캐시하지 않는다 — 데이터 정확성이 걸린 곳은 항상 서버 응답을
 *   그대로 기다린다. 이 캐시는 순수 조회(get/list)에만 쓰인다.
 * - 캐시가 5분보다 오래됐으면 "먼저 보여주는 용도"로도 쓰지 않는다(너무 오래된 값을
 *   먼저 보여줬다가 헷갈리는 것보다는, 그 상황에선 그냥 로딩 표시가 낫다고 판단).
 */
const API_CACHE_PREFIX = 'apiCache:';
const API_CACHE_MAX_AGE_MS = 5 * 60 * 1000;
const API_CACHE_WRITE_ACTIONS = /^(add|update|delete|confirm|cancel|apply|close|settle|create|adjust|set|init)/i;

function _cacheKey(action, args) { return API_CACHE_PREFIX + action + ':' + JSON.stringify(args || []); }

// 캐시에 있는 "최근 성공 응답의 data"를 즉시 돌려준다. 없거나 너무 오래됐으면 null.
function peekApiCache(action, args = []) {
  try {
    const raw = localStorage.getItem(_cacheKey(action, args));
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Date.now() - parsed.ts > API_CACHE_MAX_AGE_MS) return null;
    return parsed.data;
  } catch (e) { return null; }
}

function _writeApiCache(action, args, data) {
  try { localStorage.setItem(_cacheKey(action, args), JSON.stringify({ data: data, ts: Date.now() })); }
  catch (e) { /* 저장공간이 꽉 찼거나 등 — 캐시는 있으면 좋고 없어도 정상 동작해야 하므로 조용히 무시 */ }
}

function _clearApiCache() {
  try {
    Object.keys(localStorage)
      .filter(k => k.indexOf(API_CACHE_PREFIX) === 0)
      .forEach(k => localStorage.removeItem(k));
  } catch (e) { /* 무시 */ }
}

function todayYm() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  }).join('');

}
function setHomePeriod(p) { homePeriod = p; loadHome(); }
function periodRange(preset) {
  const now = new Date(); let start, end;
  if (preset === 'thisMonth') { start = new Date(now.getFullYear(), now.getMonth(), 1); end = new Date(now.getFullYear(), now.getMonth() + 1, 0); }
  else if (preset === 'lastMonth') { start = new Date(now.getFullYear(), now.getMonth() - 1, 1); end = new Date(now.getFullYear(), now.getMonth(), 0); }
  else if (preset === 'last3') { start = new Date(now.getFullYear(), now.getMonth() - 2, 1); end = new Date(now.getFullYear(), now.getMonth() + 1, 0); }
  else { start = new Date(now.getFullYear(), 0, 1); end = new Date(now.getFullYear(), 11, 31); }
  return [ymd(start), ymd(end)];
}
async function fetchHome() {
  const [start, end] = periodRange(homePeriod);

// 접었다 펼 수 있는 카드. jumpView(있으면) 본문 맨 아래에 "자세히 보기" 링크를 따로 둔다 —
// 예전엔 펼침/접힘 화살표 바로 옆에 있어서 접으려다 실수로 다른 화면으로 넘어가버리기 쉬웠음.
function accordionCard(title, id, expanded, bodyHtml, jumpView, jumpSub) {
  const jumpLink = jumpView ? '<div style="text-align:right;margin-top:10px;"><span style="font-size:12px;font-weight:700;color:var(--gold-deep);cursor:pointer;" onclick="jumpTo(\'' + jumpView + '\'' + (jumpSub ? ",'" + jumpSub + "'" : '') + ')">자세히 보기 →</span></div>' : '';

const EV_COLOR = { '휴가': '#2E9E63', '대근': '#C026D3', '교육': '#2563EB', '건강검진': '#0891B2', '개인일정': '#4B5563' };
// 중요도: 'high'=빨강 깜빡임, 'normal'=주황 은은하게, ''=표시 없음.
// 예전 데이터는 Priority가 비어 있고 IsImportant만 true인데, 그건 'high'로 본다(하위호환).
function eventLevel(e) {
  const p = String(e.Priority || '').toLowerCase();
  if (p === 'high' || p === 'normal') return p;
  return String(e.IsImportant) === 'true' ? 'high' : '';
}

// 실시간 예상월급 — 스코프에 맞게: 진한/선영 선택 시 그 사람 것만, 공동이면 둘을 합산.
async function fetchPayrollTicker(primaryPayrollEstimate) {
  const el = document.getElementById('payrollTickerInline');
  if (!el) return;
  const primaryId = primaryOwnerId();
  if (SCOPE !== 'shared' && SCOPE !== primaryId) {
    const args = [SCOPE, todayYm()];
    const cached = peekApiCache('getPayrollEstimate', args);
    if (cached) el.innerHTML = '💰 ' + profileName(SCOPE) + ' 예상 월급 <b>' + fmtWon(cached.estimated) + '</b>';
    const res = await api('getPayrollEstimate', args);
    const amt = res.success ? res.data.estimated : null;
    el.innerHTML = amt !== null ? '💰 ' + profileName(SCOPE) + ' 예상 월급 <b>' + fmtWon(amt) + '</b>' : '';
    return;
  }
  if (SCOPE === 'shared') {
    const others = PROFILES.filter(p => p.ProfileID !== primaryId);
    const otherTotals = await Promise.all(others.map(p => api('getPayrollEstimate', [p.ProfileID, todayYm()])));
    const otherSum = otherTotals.reduce((s, r) => s + (r.success ? r.data.estimated : 0), 0);
    const total = (primaryPayrollEstimate || 0) + otherSum;
    el.innerHTML = '💰 공동 예상 월급 <b>' + fmtWon(total) + '</b>';
    return;
  }
  el.innerHTML = primaryPayrollEstimate !== null && primaryPayrollEstimate !== undefined
    ? '💰 ' + profileName(primaryId) + ' 예상 월급 <b>' + fmtWon(primaryPayrollEstimate) + '</b>' : '';
}
function renderAllTeamsView(shiftsByTeam) {
  const teams = ['A', 'B', 'C', 'D'];
  const dates = Object.keys(shiftsByTeam['A']).sort();
  const lead = new Date(dates[0]).getDay();
  const cells = Array(lead).fill(null).concat(dates);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) { const w = cells.slice(i, i + 7); while (w.length < 7) w.push(null); weeks.push(w); }
  const today = todayStr();
  let html = '<div style="display:grid;grid-template-columns:28px repeat(7,1fr);gap:2px;margin-bottom:6px;">' +
    '<div></div>' + WD.map(w => '<div style="text-align:center;font-size:10px;font-weight:700;color:var(--ink-mute);">' + w + '</div>').join('') + '</div>';
  weeks.forEach(week => {
    html += '<div style="display:grid;grid-template-columns:28px repeat(7,1fr);gap:2px;margin-bottom:2px;">';
    html += '<div></div>' + week.map(d => {
      const isToday = d === today;
      return '<div style="text-align:center;font-size:' + (isToday ? '11px' : '9px') + ';font-weight:' + (isToday ? '900' : '400') + ';color:' + (isToday ? 'var(--gold-deep)' : 'var(--ink-mute)') + ';">' + (d ? Number(d.split('-')[2]) : '') + '</div>';
    }).join('');
    html += '</div>';
    teams.forEach(t => {
      html += '<div style="display:grid;grid-template-columns:28px repeat(7,1fr);gap:2px;margin-bottom:3px;">';
      html += '<div style="font-size:10px;font-weight:800;display:flex;align-items:center;">' + t + '조</div>';
      html += week.map(d => {
        if (!d) return '<div></div>';
        const type = shiftsByTeam[t][d];
        const isToday = d === today;
        const style = isToday
          ? 'height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;box-shadow:0 0 0 2px var(--gold);'
          : 'height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;';
        return '<div style="' + style + '" class="b-' + type + '">' + type + '</div>';
      }).join('');
      html += '</div>';
    });
    html += '<div style="height:1px;background:var(--border);margin:6px 0;"></div>';
  });
  document.getElementById('calAllTeamsView').innerHTML = html;
}
function todayStr() { const t = new Date(); return ymd(t); }
function renderCalGrid(shifts, events) {
  const dates = Object.keys(shifts).sort();
  const lead = new Date(dates[0]).getDay();
  const cells = Array(lead).fill(null).concat(dates);
  const today = todayStr();
  document.getElementById('calGrid').innerHTML = cells.map(dateStr => {
    if (!dateStr) return '<div></div>';
    const type = shifts[dateStr];
    const num = Number(dateStr.split('-')[2]);
    const dayEvents = events.filter(e => e.EventDate === dateStr);

    // 글자로 보여주는 건 세 가지 — 휴가·대근·지정휴무. 전부 근무/급여가 직접 바뀌는 일이라
    // 달력을 훑을 때 바로 보여야 한다. 나머지(교육/건강검진/개인일정)는 색 점으로만.
    let badgeCls = 'b-' + type, badgeText = type;
    const swap = dayEvents.find(e => e.Type === '대근');
    const vac = dayEvents.find(e => e.Type === '휴가');
    const drest = dayEvents.find(e => e.Type === '지정휴무');
    if (swap) {
      const night = swap.SwapDirection === '야간';
      badgeCls = night ? 'b-대근야간' : 'b-대근주간';
      badgeText = night ? '대근야' : '대근주';
    } else if (vac) { badgeCls = 'b-휴가'; badgeText = '휴가'; }
    else if (drest) { badgeCls = 'b-지정휴무'; badgeText = '지정휴무'; }

    const others = dayEvents.filter(e => e !== swap && e !== vac && e !== drest);
    const dots = others.slice(0, 3).map(e =>
      '<span class="evDot" style="background:' + (EV_COLOR[e.Type] || '#6B7280') + ';"></span>').join('') +
      (others.length > 3 ? '<span class="evMore">+' + (others.length - 3) + '</span>' : '');
    // 중요일정은 문구 없이 빨간 점만 깜빡인다 — 무슨 일인지는 눌러서 확인.
    const levels = dayEvents.map(eventLevel);
    const level = levels.indexOf('high') !== -1 ? 'high' : (levels.indexOf('normal') !== -1 ? 'mid' : '');

    return '<div class="dayCell bg-' + type + (dateStr === today ? ' today' : '') + '" onclick="openDaySheet(\'' + dateStr + '\')">' +
      '<span class="num">' + num + '</span>' +
      (dots ? '<span class="dots">' + dots + '</span>' : '') +
      '<span class="badge ' + badgeCls + '">' + badgeText + '</span>' +
      (level ? '<span class="dotImp ' + level + '"></span>' : '') + '</div>';
  }).join('');
}

function editJournalM(id) {

  if (!j) return;
  document.querySelectorAll('.segBtn').forEach(b => b.classList.remove('active'));
  document.getElementById('addFormBox').innerHTML =
    '<div class="cardTitle">일지 수정</div>' +
    '<div class="field"><label>제목</label><input id="eJTitle" value="' + (j.Title || '').replace(/"/g, '&quot;') + '"></div>' +
    '<div class="field"><label>내용</label><input id="eJContent" value="' + (j.Content || '').replace(/"/g, '&quot;') + '"></div>' +
    '<div class="field"><label><input type="checkbox" id="eJImportant"' + (String(j.IsImportant) === 'true' ? ' checked' : '') + '> 중요일정</label></div>' +
    '<button class="btn btn-gold" onclick="saveJournalEditM(\'' + id + '\')">저장</button> <button class="btn-sm btn-ghost" onclick="switchAddSeg(\'event\')">취소</button>';
}
async function saveJournalEditM(id) {
  const patch = { Title: document.getElementById('eJTitle').value, Content: document.getElementById('eJContent').value, IsImportant: document.getElementById('eJImportant').checked };
  const res = await api('updateJournalEntry', [id, patch]);
  if (!res.success) { alert('저장 실패: ' + res.message); return; }
  refreshDaySheet();
}
function switchAddSeg(type) {
  document.querySelectorAll('.segBtn').forEach(b => b.classList.toggle('active', b.dataset.add === type));
  if (type === 'event') showAddEventForm();
  else showAddJournalForm(type);
}

let QUICK_LEAVE_CODES = [];
async function showAddEventForm() {
  const box = document.getElementById('addFormBox');
  box.innerHTML =
    ownerSelectHtml('qOwner') +
    '<div class="field"><label>유형</label><select id="qEvType" onchange="qToggleFields()"><option>휴가</option><option>대근</option><option>지정휴무</option><option>건강검진</option><option>교육</option><option>개인일정</option></select></div>' +
    '<div class="field" id="qLeaveRow"><label>휴가코드</label><select id="qLeaveCode"><option value="">선택안함</option></select></div>' +
    '<div class="field" id="qSwapRow" style="display:none;"><label>대근 근무유형</label><select id="qSwapType"><option value="주간">주간대근</option><option value="야간">야간대근</option></select></div>' +
    '<div class="field"><label>메모</label><input id="qMemo"></div>' +
    '<div class="field"><label>장소(선택)</label><input id="qLocation" placeholder="예: 회사, 병원"></div>' +
    '<div class="field"><label>중요도</label><select id="qPriority">' +
    '<option value="">표시 안 함</option><option value="normal">주황 (가볍게 볼 일)</option><option value="high">빨강 (꼭 챙길 일)</option></select></div>' +
    '<button class="btn btn-gold" onclick="submitQuickEvent()">저장</button>';
  const res = await api('listLeaveCodes');
  if (res.success) {
    QUICK_LEAVE_CODES = res.data;
    const sel = document.getElementById('qLeaveCode');
    res.data.forEach(c => { const o = document.createElement('option'); o.value = c.CodeID; o.text = c.Name; sel.appendChild(o); });
  }
  qToggleFields();
}
function ownerSelectHtml(id, onchange, label) {
  const def = SCOPE !== 'shared' ? SCOPE : primaryOwnerId();
  return '<div class="field"><label>' + (label || '작성자') + '</label><select id="' + id + '"' + (onchange ? ' onchange="' + onchange + '"' : '') + '>' +
    PROFILES.map(p => '<option value="' + p.ProfileID + '"' + (p.ProfileID === def ? ' selected' : '') + '>' + p.Name + '</option>').join('') + '</select></div>';
}
function showAddJournalForm(type) {
  const entryType = type === 'worklog' ? '작업일지' : '개인일기';
  const box = document.getElementById('addFormBox');
  box.innerHTML =
    ownerSelectHtml('qJOwner') +
    '<div class="field"><label>제목</label><input id="qJTitle" placeholder="' + (type === 'worklog' ? '예: 3호기 정비' : '오늘 있었던 일 간단히') + '"></div>' +
    '<div class="field"><label>내용</label><input id="qJContent"></div>' +
    '<div class="field"><label><input type="checkbox" id="qJImportant"> 중요일정</label></div>' +
    '<button class="btn btn-gold" onclick="submitQuickJournal(\'' + entryType + '\')">저장</button>';
}
async function submitQuickJournal(entryType) {
  const entry = {
    OwnerID: document.getElementById('qJOwner').value, EntryDate: calSelectedDate, EntryType: entryType,
    Title: document.getElementById('qJTitle').value, Content: document.getElementById('qJContent').value,
    EquipmentTag: '', ImagePaths: '[]', IsImportant: document.getElementById('qJImportant').checked
  };
  // 낙관적 UI: 서버 응답을 기다리지 않고 목록에 바로 반영(살짝 반투명 + "저장 중…"). 실패하면 되돌림.
  DAY_JOURNAL_CACHE = DAY_JOURNAL_CACHE.concat([Object.assign({ _pending: true }, entry)]);
  renderDayJournalList();

  const res = await api('addJournalEntry', [entry]);
  if (!res.success) {
    DAY_JOURNAL_CACHE = DAY_JOURNAL_CACHE.filter(j => !j._pending);
    renderDayJournalList();
    alert('저장 실패: ' + res.message);
    return;
  }
  refreshDaySheet();
}
function qToggleFields() {
  const val = document.getElementById('qEvType').value;
  const isSwap = val === '대근';
  const noLeaveCode = isSwap || val === '개인일정' || val === '지정휴무';
  document.getElementById('qSwapRow').style.display = isSwap ? '' : 'none';
  document.getElementById('qLeaveRow').style.display = noLeaveCode ? 'none' : '';
  // 유형(교육/건강검진 등)을 고르면 이름이 같은 휴가코드를 자동으로 같이 선택해준다.
  // 예전엔 "유형"과 "휴가코드"가 서로 다른 선택창이라 유형만 고르고 휴가코드는
  // "선택안함"으로 깜빡 남겨두는 경우가 있었는데, 그러면 급여 계산에 그 이벤트가 아예
  // 안 잡힌다(연장근무수당 계산이 LeaveCodeID를 보고 판단하기 때문).
  if (!noLeaveCode) {
    const match = QUICK_LEAVE_CODES.find(c => c.Name === val);
    const leaveSel = document.getElementById('qLeaveCode');
    if (match && leaveSel) leaveSel.value = match.CodeID;
  }
}
async function submitQuickEvent() {
  const type = document.getElementById('qEvType').value;
  const ev = {
    OwnerID: document.getElementById('qOwner').value, EventDate: calSelectedDate, Type: type,
    Memo: document.getElementById('qMemo').value,
    Location: document.getElementById('qLocation').value,
    Priority: document.getElementById('qPriority').value,
    // IsImportant는 "다가오는 중요일정" 배너가 쓰는 기존 필드 — 주황/빨강 둘 다 true로 둬서 배너에 뜨게 한다.
    IsImportant: !!document.getElementById('qPriority').value,
    SwapDirection: type === '대근' ? document.getElementById('qSwapType').value : '',
    CounterpartName: '', LeaveCodeID: type !== '대근' && type !== '개인일정' ? document.getElementById('qLeaveCode').value : '',
    EventHours: '', EventAmount: ''
  };
  // 낙관적 UI: 저장 결과를 기다리지 않고 "일정" 목록에 바로 반영. 실패하면 그 자리에서 되돌림.
  DAY_EVENTS_CACHE = DAY_EVENTS_CACHE.concat([Object.assign({ _pending: true }, ev)]);
  renderDayEventsList();

  const res = await api('addEvent', [ev]);
  if (!res.success) {
    DAY_EVENTS_CACHE = DAY_EVENTS_CACHE.filter(e => !e._pending);
    renderDayEventsList();
    alert('저장 실패: ' + res.message);
    return;
  }
  refreshDaySheet();
  fetchCalendar();
}


/* ================= 급여예측 ================= */
async function loadPayroll() {
  const el = document.getElementById('view-payroll');
  if (!PROFILES.length) { const r = await api('listProfiles'); if (r.success) PROFILES = r.data; }
  const targets = SCOPE === 'shared' ? PROFILES : PROFILES.filter(p => p.ProfileID === SCOPE);
  el.innerHTML = '<div id="payrollContent" class="muted" style="padding:20px 0;">불러오는 중...</div>';
  const box = document.getElementById('payrollContent');

  // 캐시-먼저: 모든 대상 프로필의 급여 데이터가 캐시에 있으면 즉시 그리고, 백그라운드로 최신값을 받아온다.
  const cachedHtmls = targets.map(p => {
    const cached = peekApiCache('getPayrollPageData', [p.ProfileID, todayYm()]);
    return cached ? renderPayrollCardHtml(p, cached) : null;
  });
  if (cachedHtmls.every(h => h !== null)) box.innerHTML = cachedHtmls.join('');

  const htmls = await Promise.all(targets.map(p => renderPayrollCard(p)));
  box.innerHTML = htmls.join('');
}
async function renderPayrollCard(profile) {
  const res = await api('getPayrollPageData', [profile.ProfileID, todayYm()]);
  if (!res.success) return '<div class="card">오류: ' + res.message + '</div>';
  return renderPayrollCardHtml(profile, res.data);
}
function renderPayrollCardHtml(profile, d) {
  const oid = profile.ProfileID;
  if (d.needsInit) return '<div class="card"><div class="cardTitle">' + profile.Name + '</div>' +
    '<div class="emptyState" style="margin-bottom:10px;">아직 급여 설정이 없어요. 아래에서 시작해주세요.</div>' +
    '<div class="field"><label>급여 방식</label><select id="initPayMode-' + oid + '" onchange="document.getElementById(\'initFixedRow-' + oid + '\').style.display=this.value===\'fixed\'?\'\':\'none\';">' +
    '<option value="shift">교대근무 공식(연장·야간 등 계산)</option><option value="fixed">고정급여(매달 같은 금액)</option></select></div>' +
    '<div class="field" id="initFixedRow-' + oid + '" style="display:none;"><label>매달 고정 금액(원)</label><input id="initFixedAmount-' + oid + '" type="number"></div>' +
    '<button class="btn btn-gold" onclick="initPayrollM(\'' + oid + '\')">시작하기</button></div>';
  const est = d.estimate;
  const detailId = 'payDetail-' + oid;
  const itemsId = 'payItems-' + oid;
  const configId = 'payConfig-' + oid;
  PAY_ITEMS_CACHE[oid] = { extra: d.extraItems || [], deduction: d.deductionItems || [] };
  const confirmedRegular = d.confirmedSalary && d.confirmedSalary.regular;
  const confirmedBonus = d.confirmedSalary && d.confirmedSalary.bonus;
  // 백엔드를 아직 새 버전으로 재배포하기 전이면 regularItems/bonusItems 없이 옛날 lineItems만
  // 올 수 있다 — 그럴 때도 화면이 깨지지 않고 "급여" 한 덩어리로라도 보이게 방어.
  const regularItems = est.regularItems || est.lineItems || [];
  const bonusItems = est.bonusItems || [];
  const regularEstimated = est.regularEstimated !== undefined ? est.regularEstimated : est.estimated;
  const bonusEstimated = est.bonusEstimated !== undefined ? est.bonusEstimated : 0;
  const lineRow = (it, idx) => {
    const neg = it.amount < 0;
    const rowId = 'payline-' + oid + '-' + idx;
    return '<div class="rowLine" style="flex-direction:column;align-items:stretch;' + (it.desc ? 'cursor:pointer;' : '') + '"' + (it.desc ? ' onclick="togglePayLineDesc(\'' + rowId + '\')"' : '') + '>' +
      '<div style="display:flex;justify-content:space-between;"><span' + (neg ? ' style="color:var(--danger);"' : '') + '>' + it.label + (it.desc ? ' <span class="muted">ⓘ</span>' : '') + '</span><span class="amt"' + (neg ? ' style="color:var(--danger);"' : '') + '>' + (neg ? '-' : '') + fmtWon(Math.abs(it.amount)) + '</span></div>' +
      (it.desc ? '<div id="' + rowId + '" class="muted" style="display:none;font-size:12px;margin-top:4px;line-height:1.5;">' + it.desc + '</div>' : '') +
      '</div>';
  };
  return '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="togglePayDetail(\'' + detailId + '\')">' +
    '<div><div class="cardTitle" style="margin-bottom:2px;">' + profile.Name + '</div><div style="font-size:22px;font-weight:800;">' + fmtWon(est.estimated) + '</div><div class="muted">실수령 추정 (급여 ' + fmtWon(regularEstimated) + ' + 상여 ' + fmtWon(bonusEstimated) + ')</div></div>' +
    '<span id="' + detailId + '-arrow" style="font-size:14px;color:var(--ink-mute);">▸ 항목보기</span></div>' +
    '<div id="' + detailId + '" style="display:none;margin-top:12px;border-top:1px solid var(--border);padding-top:10px;">' +
    '<div class="muted" style="margin-bottom:6px;">' + est.periodStart + ' ~ ' + est.periodEnd + ' → ' + est.payMonth + ' 지급 · <span style="text-decoration:underline;cursor:pointer;" onclick="event.stopPropagation();jumpTo(\'settings\',\'payguide\')">항목 설명 보기</span></div>' +
    '<div class="muted" style="font-weight:700;margin:8px 0 2px;">급여 (보통 20일 입금)</div>' +
    regularItems.map(lineRow).join('') +
    '<div class="muted" style="font-weight:700;margin:14px 0 2px;">상여 · 경영성과금 (보통 25일 입금)</div>' +
    (bonusItems.map(lineRow).join('') || '<div class="emptyState">해당 없음</div>') +
    '</div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-top:10px;" onclick="togglePayDetail(\'' + itemsId + '\')">' +
    '<span class="cardTitle" style="margin:0;">급여 항목 관리</span>' +
    '<span id="' + itemsId + '-arrow" style="font-size:14px;color:var(--ink-mute);">▸ 펼치기</span></div>' +
    '<div id="' + itemsId + '" style="display:none;margin-top:10px;">' + renderPayItemsBoxHtml(oid) + '</div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-top:10px;" onclick="togglePayDetail(\'' + configId + '\')">' +
    '<span class="cardTitle" style="margin:0;">기본 급여 설정</span>' +
    '<span id="' + configId + '-arrow" style="font-size:14px;color:var(--ink-mute);">▸ 펼치기</span></div>' +
    '<div id="' + configId + '" style="display:none;margin-top:10px;">' + renderPayConfigBoxHtml(oid, est.config, d.accounts || []) + '</div>' +
    '<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border);">' +
    '<div class="muted" style="margin-bottom:4px;">급여(20일) — ' + (confirmedRegular ? '이미 확정됨: ' + fmtWon(confirmedRegular.ConfirmedAmount) : '아직 확정 안 함') + '</div>' +
    '<div class="field"><input id="payConfirmAmount-regular-' + oid + '" type="number" placeholder="' + regularEstimated + '"></div>' +
    '<button class="btn btn-gold" onclick="submitPayrollConfirm(\'' + oid + '\',\'regular\')">급여 확정 입력</button>' +
    '<div class="muted" style="margin:14px 0 4px;">상여·경영성과금(25일) — ' + (confirmedBonus ? '이미 확정됨: ' + fmtWon(confirmedBonus.ConfirmedAmount) : '아직 확정 안 함') + '</div>' +
    '<div class="field"><input id="payConfirmAmount-bonus-' + oid + '" type="number" placeholder="' + bonusEstimated + '"></div>' +
    '<button class="btn btn-ghost" onclick="submitPayrollConfirm(\'' + oid + '\',\'bonus\')">상여 확정 입력</button>' +
    '</div></div>';
}
function togglePayLineDesc(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? '' : 'none';
}
// 직무기준급이 바뀌면(승진/연봉조정 등) 여기서 한 번만 고치면, 그걸로 계산되는 연장/야간/
// 가산/지정휴무일수당까지 전부 같이 바뀐다(통상임금이 직무기준급 등에서 자동 계산되므로).
function renderPayConfigBoxHtml(oid, cfg, accounts) {
  const num = (v, d) => (v !== '' && v !== undefined && v !== null && !isNaN(Number(v))) ? Number(v) : d;
  const acctOpts = '<option value="">선택 안 함</option>' + (accounts || []).map(a => '<option value="' + a.AccountID + '"' + (a.AccountID === cfg.DefaultPayoutAccountID ? ' selected' : '') + '>' + a.Name + '</option>').join('');
  return '<div class="muted" style="margin-bottom:8px;line-height:1.5;">여기 값을 바꾸면 연장·야간·가산·지정휴무일수당까지 자동으로 같이 계산돼요. 직무기준급이 오르면 이 칸만 고치면 됩니다.</div>' +
    '<div class="field"><label>급여 입금계좌 <span class="muted">(확정 입력 시 이 계좌로 거래가 생성돼요)</span></label><select id="cfgPayoutAccount-' + oid + '">' + acctOpts + '</select></div>' +
    '<div class="field"><label>직무기준급(원)</label><input id="cfgBasePay-' + oid + '" type="number" value="' + num(cfg.BasePay, 0) + '"></div>' +
    '<div class="field"><label>중식비(원)</label><input id="cfgMeal-' + oid + '" type="number" value="' + num(cfg.MealAllowance, 0) + '"></div>' +
    '<div class="field"><label>자기설계지원금(원)</label><input id="cfgSelfDesign-' + oid + '" type="number" value="' + num(cfg.SelfDesignSupport, 0) + '"></div>' +
    '<div class="field"><label>직무환경수당(원)</label><input id="cfgJobEnv-' + oid + '" type="number" value="' + num(cfg.JobEnvAllowance, 0) + '"></div>' +
    '<div class="field"><label>교대근무수당 비율(%, 보통 8)</label><input id="cfgShiftRate-' + oid + '" type="number" step="0.01" value="' + (num(cfg.ShiftAllowanceRate, 0) * 100) + '"></div>' +
    '<div class="field"><label>업적급 비율(%, 세전 기준)</label><input id="cfgPerfRate-' + oid + '" type="number" step="0.01" value="' + (num(cfg.PerformancePayRate, 0) * 100) + '"></div>' +
    '<div class="field"><label>경영성과금 비율(%)</label><input id="cfgMgmtRate-' + oid + '" type="number" step="0.01" value="' + (num(cfg.ManagementBonusRate, 0) * 100) + '"></div>' +
    '<div style="font-weight:700;margin:14px 0 4px;">통상임금·대근·지정휴무 계산값</div>' +
    '<div class="field"><label>통상임금 보정계수(기본 1 — 실제 명세서와 안 맞으면 조정)</label><input id="cfgCalib-' + oid + '" type="number" step="0.0001" value="' + num(cfg.OrdinaryWageCalibration, 1) + '"></div>' +
    '<div class="field"><label>분기당 지정휴무일수(기본 2)</label><input id="cfgRestDays-' + oid + '" type="number" value="' + num(cfg.DesignatedRestDaysPerQuarter, 2) + '"></div>' +
    '<div class="field"><label>지정휴무일 시간(기본 12)</label><input id="cfgRestHours-' + oid + '" type="number" value="' + num(cfg.DesignatedRestHours, 12) + '"></div>' +
    '<div class="field"><label>야간대근 총 시간(기본 12)</label><input id="cfgSwapNightTotal-' + oid + '" type="number" value="' + num(cfg.SwapNightTotalHours, 12) + '"></div>' +
    '<div class="field"><label>야간대근 중 야간대 시간(기본 8)</label><input id="cfgSwapNightNight-' + oid + '" type="number" value="' + num(cfg.SwapNightNightHours, 8) + '"></div>' +
    '<div class="field"><label>주간대근 총 시간(기본 12)</label><input id="cfgSwapDayTotal-' + oid + '" type="number" value="' + num(cfg.SwapDayTotalHours, 12) + '"></div>' +
    '<button class="btn btn-gold" onclick="savePayConfigM(\'' + oid + '\')">저장</button>';
}
async function savePayConfigM(oid) {
  const patch = {
    DefaultPayoutAccountID: document.getElementById('cfgPayoutAccount-' + oid).value,
    BasePay: Number(document.getElementById('cfgBasePay-' + oid).value),
    MealAllowance: Number(document.getElementById('cfgMeal-' + oid).value),
    SelfDesignSupport: Number(document.getElementById('cfgSelfDesign-' + oid).value),
    JobEnvAllowance: Number(document.getElementById('cfgJobEnv-' + oid).value),
    ShiftAllowanceRate: Number(document.getElementById('cfgShiftRate-' + oid).value) / 100,
    PerformancePayRate: Number(document.getElementById('cfgPerfRate-' + oid).value) / 100,
    ManagementBonusRate: Number(document.getElementById('cfgMgmtRate-' + oid).value) / 100,
    OrdinaryWageCalibration: Number(document.getElementById('cfgCalib-' + oid).value) || 1,
    DesignatedRestDaysPerQuarter: Number(document.getElementById('cfgRestDays-' + oid).value),
    DesignatedRestHours: Number(document.getElementById('cfgRestHours-' + oid).value),
    SwapNightTotalHours: Number(document.getElementById('cfgSwapNightTotal-' + oid).value),
    SwapNightNightHours: Number(document.getElementById('cfgSwapNightNight-' + oid).value),
    SwapDayTotalHours: Number(document.getElementById('cfgSwapDayTotal-' + oid).value)
  };
  const res = await api('updateSalaryConfigFields', [oid, patch]);
  if (!res.success) { alert('저장 실패: ' + res.message); return; }
  loadPayroll();
}
function togglePayDetail(id) {
  const box = document.getElementById(id);
  const arrow = document.getElementById(id + '-arrow');
  const open = box.style.display !== 'none';
  box.style.display = open ? 'none' : '';
  arrow.innerText = open ? (id.indexOf('payItems-') === 0 ? '▸ 펼치기' : '▸ 항목보기') : '▾ 접기';
}
/* ---- 급여 항목(추가수당/공제항목) 관리: 수정·추가·삭제·순서변경 ----

async function savePayItemM(kind, oid, itemId) {

/* ================= 가계부 ================= */
/* 가계부 화면: cache-first + "폼은 딱 1번만 그림".
 * 캐시(또는 최초 응답)로 폼(입력창)을 한 번 그린 뒤에는, 그 뒤에 도착하는 백그라운드
 * 최신 데이터로 절대 폼을 다시 그리지 않는다 — 목록(#ltTxnList, #transferListM)만
 * 갱신한다. 그래야 사용자가 금액을 입력하는 도중에 백그라운드 새로고침이 끝나도
 * 입력하던 값이 사라지지 않는다. (반대로 거래추가 성공 직후의 loadLedger() 호출은
 * 쓰기 액션이 이미 캐시를 비워놨기 때문에 항상 캐시 없이 새로 폼까지 다시 그린다 —
 * 이건 원래부터 그랬던 동작이라 새로 생기는 리스크가 아니다.)
 */
async function loadLedger() {
  const el = document.getElementById('view-ledger');
  el.innerHTML =
    '<div class="pillTabs">' +
    '<button class="pill active" data-lt="exp" onclick="switchLtView(\'exp\')">지출</button>' +
    '<button class="pill" data-lt="transfer" onclick="switchLtView(\'transfer\')">이체</button>' +
    '<button class="pill" data-lt="inc" onclick="switchLtView(\'inc\')">변동소득</button>' +
    '<button class="pill" data-lt="card" onclick="switchLtView(\'card\')">카드</button>' +
    '<button class="pill" data-lt="budget" onclick="switchLtView(\'budget\')">지출목표</button></div>' +
    '<div id="ltExp"><div class="muted" style="padding:20px 0;">불러오는 중...</div></div>' +
    '<div id="ltTransfer" style="display:none;"></div><div id="ltInc" style="display:none;"></div>' +
    '<div id="ltCard" style="display:none;"></div><div id="ltBudget" style="display:none;"></div>';
  const ownerFilter = SCOPE === 'shared' ? 'all' : SCOPE;
  const args = [todayYm(), ownerFilter];

  let shellBuilt = false;
  const cached = peekApiCache('getExpenseTabData', args);
  if (cached) { await renderLtShell(cached); shellBuilt = true; }

  const res = await api('getExpenseTabData', args);
  if (!res.success) { if (!shellBuilt) document.getElementById('ltExp').innerHTML = '오류: ' + res.message; return; }
  if (!shellBuilt) {
    await renderLtShell(res.data);
  } else {
    // 폼은 이미 캐시로 그려놨으니 다시 안 그리고, 목록만 실제 최신값으로 조용히 갱신.
    updateLtTxnList(res.data.transactions);
    updateLtTransferList(res.data.transactions);
  }
}

// 결제수단을 한눈에: 신용/체크/현금을 구분해서 보여준다(예전엔 전부 '카드'로 뭉뚱그려졌음).
function payMethodIcon(label) {
  if (label === '신용카드') return '💳신용 ';
  if (label === '체크카드') return '💳체크 ';
  if (label === '현금') return '💵 ';
  return '';
}
// 카테고리 이름에 있는 키워드로 이모지를 골라서 맨 앞에 붙인다 — 어디에 썼는지 한눈에.
// 정확한 분류가 목적이 아니라 "훑어볼 때 감이 오는" 정도가 목적이라 키워드 매칭이면 충분함.
function categoryEmoji(t) {
  if (t.TxnType === '이체') return '🔁';
  if (t.TxnType === '수입') return '💰';
  if (t.TxnType === '조정') return '🛠️';
  var name = t.CategoryName || '';
  var rules = [
    ['식비', '🍚'], ['카페', '☕'], ['간식', '☕'], ['교통', '🚗'], ['주유', '⛽'],
    ['통신', '📱'], ['관리비', '🏠'], ['주거', '🏠'], ['공과금', '💡'],
    ['보험', '🛡️'], ['의료', '🏥'], ['건강', '🏥'], ['자녀', '🍼'], ['양육', '🍼'],
    ['문화', '🎬'], ['여가', '🎬'], ['미용', '💇'], ['경조사', '🎁'], ['명절', '🎁'],
    ['자동차', '🚙'], ['여행', '✈️'], ['가전', '🛋️'], ['가구', '🛋️'], ['쇼핑', '🛍️'], ['의류', '🛍️']
  ];
  for (var i = 0; i < rules.length; i++) { if (name.indexOf(rules[i][0]) !== -1) return rules[i][1]; }
  return '🧾';
}
function shortDate(d) { return String(d || '').slice(5).replace('-', '/'); } // '2026-09-16' → '09/16'
/* 목록의 각 줄은 눌러서 수정/삭제할 수 있다(저장 중인 임시 줄은 제외 — 아직 TxnID가 없음).
 * 한 줄에 한 항목만 — 텍스트가 길어지면 줄바꿈되는 대신 말줄임표로 잘리고(.txnText),
 * 날짜/아이콘은 왼쪽에, 금액/수정아이콘은 오른쪽에 고정폭으로 고정돼서 안 밀린다. */
let LT_TXN_MAP = {};
function rememberTxns(list) { (list || []).forEach(t => { if (t.TxnID) LT_TXN_MAP[t.TxnID] = t; }); }
function txnRowHtml(t) {
  const sign = t.TxnType === '지출' ? '-' : '+'; const color = t.TxnType === '지출' ? 'var(--danger)' : 'var(--success)';

function updateLtTxnList(transactions) {

/* ---- 거래 수정 / 삭제 ----
 * 잔액 되돌리기는 서버(updateTransaction)가 "옛 거래 영향 취소 → 새 내용으로 다시 적용"으로
 * 처리하므로, 여기서는 바뀐 필드만 보내면 된다. 신용카드로 바꾸면 은행계좌가 아니라
 * 카드 부채계좌로 자동으로 다시 연결되는 것도 서버가 알아서 한다.
 */
function openTxnEditor(txnId) {
  const t = LT_TXN_MAP[txnId];
  if (!t) return;
  const accOpts = (sel) => optsHtml(accountsFor(t.OwnerID, true), 'AccountID', a => a.Name, sel);
  const isTransfer = t.TxnType === '이체';
  let body =
    '<div class="muted" style="margin-bottom:10px;">' + t.TxnType + (t.ReferenceType ? ' · ' + t.ReferenceType : '') + '</div>' +
    '<div class="field"><label>날짜</label><input id="etDate" type="date" value="' + (t.TxnDate || '') + '"></div>' +
    '<div class="field"><label>금액</label><input id="etAmount" type="number" value="' + Number(t.Amount || 0) + '"></div>';
  if (isTransfer) {
    body += '<div class="field"><label>출금 계좌</label><select id="etFrom">' + accOpts(t.FromAccountID) + '</select></div>' +
      '<div class="field"><label>입금 계좌</label><select id="etTo">' + accOpts(t.ToAccountID) + '</select></div>';
  } else {
    const curAcc = LT_ACCOUNTS.find(a => a.AccountID === t.AccountID);
    const cur = t.CardID ? (t.CardKind === 'DEBIT' ? 'debit' : 'credit') : (curAcc && curAcc.Type === '현금' ? 'cash' : 'account');
    const opt = (v, label) => '<option value="' + v + '"' + (cur === v ? ' selected' : '') + '>' + label + '</option>';
    body += '<div class="field"><label>결제수단</label><select id="etPayMethod" onchange="toggleEtPayMethod()">' +
      opt('account', '계좌이체·자동이체') + opt('credit', '신용카드') + opt('debit', '체크카드') + opt('cash', '현금') + '</select></div>' +
      '<div class="field" id="etAccountRow"><label>계좌</label><select id="etAccount">' + accOpts(t.AccountID) + '</select></div>' +
      '<div class="field" id="etCardRow"><label>카드</label><select id="etCard">' +

function toggleEtPayMethod() {
  const m = document.getElementById('etPayMethod').value;
  const byCard = m === 'credit' || m === 'debit';
  document.getElementById('etAccountRow').style.display = m === 'account' ? '' : 'none';
  document.getElementById('etCardRow').style.display = byCard ? '' : 'none';
  if (byCard) {
    // 신용/체크를 바꾸면 그 종류의 카드만 보이게
    const kind = m === 'credit' ? 'CREDIT' : 'DEBIT';
    const sel = document.getElementById('etCard');
    const keep = sel.value;
    const cards = LT_CARDS.filter(c => c.CardKind === kind);
    sel.innerHTML = optsHtml(cards, 'CardID', c => c.CardName) || '<option value="">(' + (m === 'credit' ? '신용' : '체크') + '카드 없음)</option>';
    if (cards.some(c => c.CardID === keep)) sel.value = keep;
  }
}
async function saveTxnEdit(txnId) {
  const t = LT_TXN_MAP[txnId];
  const patch = {
    TxnDate: document.getElementById('etDate').value,
    Amount: Number(document.getElementById('etAmount').value),
    Memo: document.getElementById('etMemo').value
  };
  if (!patch.Amount) { alert('금액을 입력하세요.'); return; }
  if (t.TxnType === '이체') {
    patch.FromAccountID = document.getElementById('etFrom').value;
    patch.ToAccountID = document.getElementById('etTo').value;
    if (patch.FromAccountID === patch.ToAccountID) { alert('출금/입금 계좌가 같아요.'); return; }
  } else {
    const m = document.getElementById('etPayMethod').value;
    const byCard = m === 'credit' || m === 'debit';
    patch.CardID = byCard ? document.getElementById('etCard').value : '';
    patch.AccountID = m === 'account' ? document.getElementById('etAccount').value : '';
    if (m === 'cash') patch.PayMethod = 'cash';
    if (byCard && !patch.CardID) { alert('카드를 선택하세요.'); return; }
    if (m === 'account' && !patch.AccountID) { alert('계좌를 선택하세요.'); return; }
    patch.CategoryID = document.getElementById('etCategory').value;
  }
  const res = await api('updateTransaction', [txnId, patch]);
  if (!res.success) { alert('수정 실패: ' + res.message); return; }
  closeSheet();
  loadLedger();
}
async function deleteTxnM(txnId) {
  if (!confirm('이 거래를 삭제할까요? 계좌 잔액도 되돌아가요.')) return;
  const res = await api('deleteTransaction', [txnId]);
  if (!res.success) { alert('삭제 실패: ' + res.message); return; }
  closeSheet();
  loadLedger();
}

function profileName(id) { const p = PROFILES.find(x => x.ProfileID === id); return p ? p.Name : ''; }

/* 계좌·카드는 "그 사람 것 + 공동 것"만 보여준다. 진한을 고르고 있는데 선영 카드가 목록에
 * 섞여 나오면 잘못 고르기 쉽고, 한 번 잘못 고르면 잔액이 엉뚱한 계좌에서 빠진다. */
function isOwnedBy(row, ownerId) {
  if (!ownerId || ownerId === 'shared' || ownerId === 'all') return true;
  return row.OwnerID === ownerId || row.OwnerID === 'shared' || !row.OwnerID;
}
// 결제/이체에 쓸 수 있는 계좌 = 자산계좌만(카드 부채계좌 제외). 현금 지갑은 직접 고르는 게 아니라
// 결제수단에서 '현금'을 고르면 자동으로 연결되므로 여기서 뺀다.
function accountsFor(ownerId, includeCash) {
  return LT_ACCOUNTS.filter(a =>
    String(a.AccountClass || '').toUpperCase() !== 'LIABILITY' && String(a.IsLiability) !== 'true' &&
    (includeCash || a.Type !== '현금') && isOwnedBy(a, ownerId));
}
function cardsFor(ownerId, kind) {
  return LT_CARDS.filter(c => isOwnedBy(c, ownerId) && (!kind || c.CardKind === kind));
}
function optsHtml(rows, idKey, labelFn, selected) {
  return rows.map(r => '<option value="' + r[idKey] + '"' + (r[idKey] === selected ? ' selected' : '') + '>' + labelFn(r) + '</option>').join('');
}

let LT_CATEGORIES = [];
let LT_ACCOUNTS = [];
let LT_CARDS = [];
function onLtCatGroupChange() {
  const group = document.getElementById('ltCatGroup').value;
  const items = LT_CATEGORIES.filter(c => c.GroupName === group);
  document.getElementById('ltCatDetail').innerHTML = items.map(c => '<option value="' + c.CategoryID + '">' + c.Name + '</option>').join('') || '<option value="">(없음)</option>';
}
function toggleLtPayMethod() {
  const m = document.getElementById('ltPayMethod').value;
  const byCard = m === 'credit' || m === 'debit';
  document.getElementById('ltAccountRow').style.display = m === 'account' ? '' : 'none';
  document.getElementById('ltCardRow').style.display = byCard ? '' : 'none';
  document.getElementById('ltCashHint').style.display = m === 'cash' ? '' : 'none';
  if (byCard) refreshLtPayOptions();
}
/* 작성자(진한/선영)를 바꾸거나 결제수단을 바꾸면 그 사람 것 + 공동 것만 다시 채운다. */
function refreshLtPayOptions() {
  const ownerSel = document.getElementById('ltOwner');
  if (!ownerSel) return;
  const owner = ownerSel.value;
  const m = document.getElementById('ltPayMethod').value;
  const accSel = document.getElementById('ltAccount');
  const keepAcc = accSel.value;
  const accs = accountsFor(owner);
  accSel.innerHTML = optsHtml(accs, 'AccountID', a => a.Name) || '<option value="">(쓸 수 있는 계좌 없음)</option>';
  if (accs.some(a => a.AccountID === keepAcc)) accSel.value = keepAcc;

  if (m === 'credit' || m === 'debit') {
    const kind = m === 'credit' ? 'CREDIT' : 'DEBIT';
    const cards = cardsFor(owner, kind);
    const cardSel = document.getElementById('ltCard');
    const keepCard = cardSel.value;
    document.getElementById('ltCardLabel').innerText = m === 'credit' ? '신용카드' : '체크카드';
    cardSel.innerHTML = optsHtml(cards, 'CardID', c => c.CardName) ||
      '<option value="">(' + (m === 'credit' ? '신용' : '체크') + '카드 없음 — 설정에서 등록하세요)</option>';
    if (cards.some(c => c.CardID === keepCard)) cardSel.value = keepCard;
    onLtCardChange();
  }
}
// 신용카드와 체크카드는 돈이 빠지는 시점이 완전히 다르므로, 고르는 순간 그걸 알려준다.
function onLtCardChange() {
  const hint = document.getElementById('ltCardHint');
  if (!hint) return;
  const card = LT_CARDS.find(c => c.CardID === document.getElementById('ltCard').value);
  if (!card) { hint.innerHTML = ''; return; }
  hint.innerHTML = card.CardKind === 'CREDIT'
    ? '신용카드 — 지금 <b>지출로 기록</b>되고 <b>카드 미결제액이 늘어나요</b>. ' + (card.AccountName || '연결계좌') + ' 잔액은 결제일에 한 번만 빠져요.'
    : '체크카드 — 지금 바로 ' + (card.AccountName || '연결계좌') + ' 잔액에서 빠져요.';
}

/* 아래 3개 submit 함수는 전부 "낙관적 UI" 패턴: 서버 응답을 기다리지 않고
 * 방금 입력한 내용을 해당 목록에 즉시 반영(회색으로 "저장 중…" 표시)한 다음 폼을
 * 비운다. 서버가 성공을 돌려주면 loadLedger()로 조용히 실제 값과 동기화하고,
 * 실패를 돌려주면 방금 넣었던 임시 항목을 제거하고 에러를 알린다. */
async function submitTransferM() {
  const fromId = document.getElementById('trFromAccount').value;
  const toId = document.getElementById('trToAccount').value;
  if (fromId === toId) { alert('출금/입금 계좌가 같아요.'); return; }
  const amount = Number(document.getElementById('trAmount').value);
  const date = document.getElementById('trDate').value;
  const memo = document.getElementById('trMemo').value;

  const list = document.getElementById('transferListM');
  const tempId = 'pendingtr-' + Date.now();
  if (list) {
    const empty = list.querySelector('.emptyState'); if (empty) empty.remove();
    const fromAcc = LT_ACCOUNTS.find(a => a.AccountID === fromId);
    const toAcc = LT_ACCOUNTS.find(a => a.AccountID === toId);
    list.insertAdjacentHTML('afterbegin', '<div id="' + tempId + '">' + transferRowHtml({ _pending: true, TxnDate: date, Amount: amount, FromAccountName: fromAcc ? fromAcc.Name : '', ToAccountName: toAcc ? toAcc.Name : '' }) + '</div>');
  }
  document.getElementById('trAmount').value = ''; document.getElementById('trMemo').value = '';

  const res = await api('createTransfer', [SCOPE !== 'shared' ? SCOPE : primaryOwnerId(), fromId, toId, amount, date, memo]);
  if (!res.success) {
    const el = document.getElementById(tempId); if (el) el.remove();
    alert('이체 실패: ' + res.message);
    return;
  }
  loadLedger();
}
async function submitLtExpense() {
  const method = document.getElementById('ltPayMethod').value;
  const byCard = method === 'credit' || method === 'debit';
  const txn = {
    OwnerID: document.getElementById('ltOwner').value,
    AccountID: method === 'account' ? document.getElementById('ltAccount').value : '',
    CardID: byCard ? document.getElementById('ltCard').value : '',
    PayMethod: method === 'cash' ? 'cash' : '', // 현금이면 서버가 그 사람의 '현금' 계좌에 붙여준다
    CategoryID: document.getElementById('ltCatDetail').value,
    Memo: document.getElementById('ltMemo').value,
    TxnDate: document.getElementById('ltDate').value, Amount: Number(document.getElementById('ltAmount').value), TxnType: '지출', Source: '수동', Status: 'confirmed'
  };
  if (!txn.Amount) { alert('금액을 입력하세요.'); return; }
  if (byCard && !txn.CardID) { alert((method === 'credit' ? '신용' : '체크') + '카드가 없어요. 설정 → 카드에서 먼저 등록해 주세요.'); return; }
  if (method === 'account' && !txn.AccountID) { alert('계좌를 선택하세요.'); return; }

  const list = document.getElementById('ltTxnList');
  const tempId = 'pendingtxn-' + Date.now();
  if (list) {
    const empty = list.querySelector('.emptyState'); if (empty) empty.remove();
    const cat = LT_CATEGORIES.find(c => c.CategoryID === txn.CategoryID);
    const card = byCard ? LT_CARDS.find(c => c.CardID === txn.CardID) : null;
    const acc = method === 'account' ? LT_ACCOUNTS.find(a => a.AccountID === txn.AccountID) : null;
    list.insertAdjacentHTML('afterbegin', '<div id="' + tempId + '">' + txnRowHtml(Object.assign({ _pending: true }, txn, {
      AccountName: card ? card.CardName : (acc ? acc.Name : '현금'),
      PayMethodLabel: method === 'cash' ? '현금' : (card ? (card.CardKind === 'CREDIT' ? '신용카드' : '체크카드') : '계좌'),
      CategoryName: cat ? cat.Name : ''
    })) + '</div>');
  }
  document.getElementById('ltAmount').value = ''; document.getElementById('ltMemo').value = '';

  const res = await api('addTransaction', [txn]);
  if (!res.success) {
    const el = document.getElementById(tempId); if (el) el.remove();

/* ---- 카드 탭: 카드 사용 현황 + 카드대금 결제 ----
 * 여기 나오는 세 숫자는 의미가 전부 다르다. 섞어 보면 안 된다.
 *   이번 달 사용액 : 이번 달에 카드로 쓴 금액 (지출 통계에 이미 들어가 있음)
 *   미결제액       : 지금 갚아야 할 카드빚 총액
 *   결제 예정액    : 이번 결제일에 나갈 것으로 보이는 "추정" 금액
 * 카드대금을 결제해도 지출이 또 생기지 않는다 — 통장 잔액과 카드빚이 같이 줄 뿐이다.
 */
let CARD_STATUS = [];
async function fetchCardStatus() {
  const box = document.getElementById('ltCard');
  if (!box) return;
  // 홈에서 바로 넘어온 경우엔 가계부 폼이 아직 안 그려졌을 수 있어서, 계좌 목록을 여기서 한 번 확보한다.
  if (!LT_ACCOUNTS.length) { const r = await api('listAccounts'); if (r.success) LT_ACCOUNTS = r.data; }
  const args = [todayYm()];
  const cached = peekApiCache('getCardStatus', args);
  if (cached) renderCardTab(cached);

    '<div class="field"><label>카드</label><select id="cpCard" onchange="prefillCardPay()">' +

    '<div class="field"><label>출금계좌</label><select id="cpAccount">' +
    payAccounts.map(a => '<option value="' + a.AccountID + '">' + a.Name + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>금액</label><input id="cpAmount" type="number"></div>' +
    '<div class="field"><label>결제일</label><input id="cpDate" type="date" value="' + ymd(new Date()) + '"></div>' +
    '<div class="field"><label>메모(선택)</label><input id="cpMemo"></div>' +
    '<button class="btn btn-gold" onclick="submitCardPayment()">카드대금 결제 기록</button></div>';
  prefillCardPay();

// 카드를 고르면 그 카드의 미결제액과 출금계좌를 자동으로 채워준다(실제 청구액이 다르면 고쳐서 저장).
function prefillCardPay(cardId) {
  const sel = document.getElementById('cpCard');
  if (!sel) return;
  if (cardId) sel.value = cardId;
  const c = CARD_STATUS.find(x => x.CardID === sel.value);
  if (!c) return;
  const amt = document.getElementById('cpAmount');
  amt.value = Math.max(0, Math.round(c.Unpaid || 0)) || '';
  const accSel = document.getElementById('cpAccount');
  if (c.SettlementAccountID && Array.from(accSel.options).some(o => o.value === c.SettlementAccountID)) accSel.value = c.SettlementAccountID;
  if (cardId) document.getElementById('cpAmount').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
async function submitCardPayment() {
  const cardId = document.getElementById('cpCard').value;
  const amount = Number(document.getElementById('cpAmount').value);
  const date = document.getElementById('cpDate').value;
  const from = document.getElementById('cpAccount').value;
  const memo = document.getElementById('cpMemo').value;
  if (!amount) { alert('결제 금액을 입력하세요.'); return; }
  const res = await api('payCardBill', [cardId, amount, date, from, memo]);
  if (!res.success) { alert('실패: ' + res.message); return; }
  alert('카드대금 결제를 기록했어요: ' + fmtWon(amount) + '\n(지출로는 잡히지 않고, 통장과 카드빚만 줄어요)');
  loadLedger();
  setTimeout(() => switchLtView('card'), 200);
}

    '<div class="card"><div class="cardTitle">이번 달 지출목표 현황</div><div id="bgList">불러오는 중...</div></div>';
  fetchBudgetStatus();
}
async function fetchBudgetStatus() {
  // #bgList는 읽기전용 목록이라(입력폼 아님) cache-first를 걱정 없이 통으로 적용해도 안전함.
  const args = [todayYm()];
  const cached = peekApiCache('getBudgetStatus', args);
  if (cached) renderBudgetListHtml(cached);
  const res = await api('getBudgetStatus', args);
  if (!res.success) { if (!cached) document.getElementById('bgList').innerText = '오류: ' + res.message; return; }
  renderBudgetListHtml(res.data);
}
function renderBudgetListHtml(data) {
  const box = document.getElementById('bgList');
  if (!box) return;
  const colorMap = { good: 'var(--success)', warn: '#c98a16', danger: 'var(--danger)' };
  const msgMap = { good: '👍 여유있어요', warn: '⚠️ 한도에 가까워지고 있어요', danger: '🚨 한도 초과!' };
  box.innerHTML = data.map(b => {
    const pct = Math.min(100, Math.round(b.Pct * 100));
    const ownerLabel = b.OwnerID === 'shared' ? '공동' : profileName(b.OwnerID);
    return '<div style="margin-bottom:14px;"><div class="rowLine"><span>' + b.Label + ' <span class="muted">(' + ownerLabel + ')</span></span><span class="iconBtn danger" style="color:var(--danger);" onclick="deleteBudgetM(\'' + b.BudgetID + '\')" title="삭제">🗑️</span></div>' +
      '<div class="barTrack"><div class="barFill" style="width:' + pct + '%;background:' + colorMap[b.Status] + ';"></div></div>' +
      '<div class="muted">' + fmtWon(b.Spent) + ' / ' + fmtWon(b.MonthlyLimit) + ' (' + pct + '%) — ' + msgMap[b.Status] + '</div></div>';
  }).join('') || '<div class="emptyState">등록된 지출목표 없음</div>';
}
async function submitBudget() {
  const ids = Array.from(document.querySelectorAll('.bgCatCheck:checked')).map(c => c.value);
  if (!ids.length) { alert('카테고리를 하나 이상 선택하세요.'); return; }
  const res = await api('addBudget', [document.getElementById('bgLabel').value, document.getElementById('bgOwner').value, ids, Number(document.getElementById('bgLimit').value)]);
  if (!res.success) { alert('저장 실패: ' + res.message); return; }
  document.getElementById('bgLabel').value = ''; document.getElementById('bgLimit').value = '';
  document.querySelectorAll('.bgCatCheck:checked').forEach(c => c.checked = false);
  fetchBudgetStatus();
}
async function deleteBudgetM(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  const res = await api('deleteBudget', [id]);
  if (!res.success) { alert(res.message); return; }
  fetchBudgetStatus();
}

async function copyAccountNumberM(id) {
  const a = SETTINGS_ACCOUNTS_CACHE.find(x => x.AccountID === id);
  if (!a || !a.AccountNumber) return;
  const el = event && event.target; // await 넘어가면 window.event가 사라질 수 있어서 미리 잡아둠
  try {
    await navigator.clipboard.writeText(a.AccountNumber);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = a.AccountNumber; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e2) { alert('복사에 실패했어요: ' + a.AccountNumber); document.body.removeChild(ta); return; }
    document.body.removeChild(ta);
  }
  if (el) { const orig = el.innerText; el.innerText = '✅'; setTimeout(() => { el.innerText = orig; }, 1200); }
}

  const scopedRules = d.rules.filter(r => isOwnedBy(r, SCOPE === 'shared' ? null : SCOPE));
  const scopedAccounts = d.accounts.filter(a => isOwnedBy(a, SCOPE === 'shared' ? null : SCOPE));
  const accOpts = scopedAccounts.map(a => '<option value="' + a.AccountID + '">' + a.Name + '</option>').join('');
  const catOpts = d.categories.map(c => '<option value="' + c.CategoryID + '">' + c.GroupName + ' · ' + c.Name + '</option>').join('');
  box.innerHTML = '<div class="card"><div class="cardTitle">고정지출 목록' + (SCOPE !== 'shared' ? ' · ' + profileName(SCOPE) : '') + '</div>' +
    (scopedRules.map(r => '<div class="rowLine"><span>' + r.Name + ' <span class="muted">(' + r.OwnerName + ', 매달 ' + r.DayOfMonth + '일)</span></span><span class="amt">' + fmtWon(r.Amount) + ' <span class="iconBtn danger" style="color:var(--danger);" onclick="delRecurring(\'' + r.RuleID + '\')" title="삭제">🗑️</span></span></div>').join('') ||
      '<div class="emptyState">' + (SCOPE === 'shared' ? '등록된 고정지출 없음' : profileName(SCOPE) + ' 명의의 고정지출이 없어요.') + '</div>') +
    '<button class="btn btn-ghost" style="margin-top:10px;" onclick="applyRecurringM()">이번 달 거래로 반영</button>' +
    '</div><div class="card"><div class="cardTitle">고정지출 추가</div>' +
    '<div class="field"><label>이름</label><input id="recName"></div>' +
    '<div class="field"><label>소유자</label><select id="recOwner">' + d.profiles.map(p => '<option value="' + p.ProfileID + '"' + (p.ProfileID === SCOPE ? ' selected' : '') + '>' + p.Name + '</option>').join('') + '<option value="shared"' + (SCOPE === 'shared' ? ' selected' : '') + '>공동</option></select></div>' +
    '<div class="field"><label>금액</label><input id="recAmount" type="number"></div>' +
    '<div class="field"><label>카테고리</label><select id="recCategory">' + catOpts + '</select></div>' +
    '<div class="field"><label>빠져나갈 계좌</label><select id="recAccount">' + (accOpts || '<option value="">(' + (SCOPE === 'shared' ? '' : profileName(SCOPE) + ' 명의') + ' 계좌 없음)</option>') + '</select></div>' +
    '<div class="field"><label>매달 며칠</label><input id="recDay" type="number" value="25"></div>' +
    '<button class="btn btn-gold" onclick="addRecurringM()">저장</button></div>';
}
async function addRecurringM() {
  const res = await api('addRecurringRule', [document.getElementById('recOwner').value, document.getElementById('recName').value, Number(document.getElementById('recAmount').value), document.getElementById('recCategory').value, document.getElementById('recAccount').value, Number(document.getElementById('recDay').value), false]);
  if (!res.success) { alert('실패: ' + res.message); return; }
  renderSettingsRecurring();
}
async function delRecurring(id) {
  if (!confirm('삭제할까요?')) return;
  const res = await api('deleteRecurringRule', [id]);
  if (!res.success) { alert(res.message); return; }
  renderSettingsRecurring();
}
async function applyRecurringM() {
  if (!confirm('등록된 고정지출을 전부 이번 달 거래로 반영할까요? (이미 반영된 항목은 자동으로 건너뜁니다)')) return;
  const res = await api('applyRecurringForMonth', [todayYm()]);
  if (!res.success) { alert('실패: ' + res.message); return; }
  var msg = res.data.created.length + '건 새로 반영됨';
  if (res.data.skipped.length) msg += ' / ' + res.data.skipped.length + '건은 이미 반영되어 건너뜀';
  alert(msg);
}

function renderSettingsTeam() {
  const box = document.getElementById('settingsBody');
  box.innerHTML = '<div class="card"><div class="cardTitle">근무조 변경</div>' +
    ownerSelectHtml('teamOwner') +
    '<div class="field"><label>새 근무조</label><select id="teamValue"><option>A</option><option>B</option><option>C</option><option>D</option></select></div>' +
    '<div class="field"><label>적용 시작일</label><input id="teamDate" type="date" value="' + ymd(new Date()) + '"></div>' +
    '<button class="btn btn-gold" onclick="submitTeamM()">저장</button></div>';
}
async function submitTeamM() {
  const res = await api('setTeam', [document.getElementById('teamOwner').value, document.getElementById('teamValue').value, document.getElementById('teamDate').value]);
  if (!res.success) { alert('실패: ' + res.message); return; }
  alert('근무조가 변경됐어요.');
}
async function loadSavings() {
  const el = document.getElementById('view-savings');
  const cached = peekApiCache('listSavingsGoals', []);
  if (cached) renderSavingsBox(el, cached);
  else el.innerHTML = '<div class="muted" style="padding:20px 0;">불러오는 중...</div>';

  const res = await api('listSavingsGoals');
  if (!res.success) { if (!cached) el.innerHTML = '오류: ' + res.message; return; }
  renderSavingsBox(el, res.data);
}
function renderSavingsBox(el, data) {
  el.innerHTML = '<div class="card"><div class="cardTitle">저축목표</div>' +
    (data.map(g => {
      const pct = Math.min(100, Math.round(g.Progress * 100));
      return '<div style="margin-bottom:14px;"><div class="rowLine"><span>' + g.Name + '</span><span>' + pct + '%</span></div>' +
        '<div class="barTrack"><div class="barFill" style="width:' + pct + '%;background:var(--gold);"></div></div>' +
        '<div class="muted">' + fmtWon(g.CurrentAmount) + ' / ' + fmtWon(g.TargetAmount) + '</div></div>';
    }).join('') || '<div class="emptyState">등록된 목표 없음 — PC 웹앱에서 추가하세요</div>') + '</div>';
}
</script>
</body>
</html>
