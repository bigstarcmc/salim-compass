<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="살림나침반">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>살림나침반</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#FBF8F2; --surface:#FFFFFF; --border:#ECE3D2;
  --ink:#1B2A4A; --ink-soft:#5B6B8C; --ink-mute:#93A0BC;
  --gold:#C9922E; --gold-deep:#8B6914; --gold-soft:#F4E7CB;
  --success:#3F7D58; --danger:#B4423D;
  --day:#E4A93B; --night:#2A3B6B; --off:#C9C2B4;
  --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Pretendard',-apple-system,sans-serif; -webkit-font-smoothing:antialiased;}
body{padding-bottom:78px; min-height:100vh;}
button,input,select,textarea{font-family:inherit;}

/* ---------- Top bar ---------- */
.topbar{position:sticky; top:0; z-index:20; background:var(--ink); color:#fff;
  padding:14px 18px 16px; display:flex; align-items:center; justify-content:space-between;
  border-radius:0 0 22px 22px;}
.topbar .brand{display:flex; align-items:center; gap:8px;}
.topbar .compass{font-size:22px; display:inline-block;}
.topbar .pageTitle{font-size:17px; font-weight:700; letter-spacing:-.2px;}
.topbar .who{font-size:12px; background:rgba(255,255,255,.14); padding:6px 12px; border-radius:20px; cursor:pointer; border:none; color:#fff;}

.scopeBar{position:sticky; top:0; z-index:19; display:flex; gap:8px; padding:10px 16px; background:var(--bg);}
.scopeBtn{flex:1; padding:10px 6px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface);
  font-size:13px; font-weight:700; color:var(--ink-soft);}
.scopeBtn.active{background:var(--gold); border-color:var(--gold); color:#fff;}
.scopeBtn[data-s="shared"].active{background:var(--ink); border-color:var(--ink);}

/* ---------- Bottom nav ---------- */
.bottomNav{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface);
  border-top:1px solid var(--border); display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.navBtn{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center;
  gap:2px; padding:6px 2px; color:var(--ink-mute); font-size:10px; font-weight:600; border-radius:12px;}
.navBtn .navIcon{font-size:20px;}
.navBtn.active{color:var(--gold-deep);}
.navBtn.active .navIcon{transform:scale(1.08);}

/* ---------- Content ---------- */
main{padding:16px 16px 24px; max-width:480px; margin:0 auto;}
.view{display:none;}
.view.active{display:block; animation:fadeUp .25s ease;}
@keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:16px; margin-bottom:12px;}
.cardHero{background:var(--ink); color:#fff; border-radius:var(--radius-lg); padding:22px 20px; margin-bottom:14px;
  position:relative; overflow:hidden;}
.cardHero::after{content:"🧭"; position:absolute; right:-10px; bottom:-18px; font-size:110px; opacity:.08;}
.cardTitle{font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:10px;}
.heroLabel{font-size:12px; opacity:.75; margin-bottom:6px;}
.heroNumber{font-size:32px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums;}
.heroSub{font-size:12px; opacity:.8; margin-top:6px;}

.muted{color:var(--ink-mute); font-size:12px;}
.rowLine{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #F4EFE3; font-size:14px;}
.rowLine:last-child{border-bottom:none;}
.rowLine .amt{font-weight:700; font-variant-numeric:tabular-nums;}

.pillTabs{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto;}
.pill{flex:0 0 auto; padding:8px 16px; border-radius:20px; border:1px solid var(--border); background:var(--surface);
  color:var(--ink-soft); font-size:13px; font-weight:600;}
.pill.active{background:var(--ink); color:#fff; border-color:var(--ink);}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:var(--radius-sm);
  padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer; width:100%;}
.btn-gold{background:var(--gold); color:#fff;}
.btn-ghost{background:var(--gold-soft); color:var(--gold-deep);}
.btn-danger{background:#F6E3E1; color:var(--danger);}
.btn-sm{width:auto; padding:7px 12px; font-size:12px; border-radius:8px;}

.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
.field input, .field select{width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:10px;
  background:#fff; font-size:14px; color:var(--ink);}
.field input[type=checkbox]{width:auto;}

.barTrack{background:#F0EAD9; border-radius:6px; height:10px; overflow:hidden; margin:6px 0;}
.barFill{height:100%; border-radius:6px;}

/* ---------- Calendar ---------- */
.calHead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.calHead button{background:var(--surface); border:1px solid var(--border); border-radius:10px; width:36px; height:36px; font-size:16px;}
.calHead .ym{font-weight:800; font-size:16px;}
.weekRow{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--ink-mute); margin-bottom:4px;}
.dayGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.dayCell{position:relative; min-height:64px; border-radius:14px; display:flex; align-items:flex-start; justify-content:flex-start;
  padding:6px; cursor:pointer; border:1px solid rgba(0,0,0,.06);}
.dayCell .num{font-size:13px; font-weight:800;}
.dayCell .badge{position:absolute; bottom:5px; right:5px; min-width:22px; height:22px; padding:0 5px; border-radius:11px;
  font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; color:#fff;}
.dayCell .memo{position:absolute; top:24px; left:6px; right:6px; font-size:10px; font-weight:700; color:var(--gold-deep);
  line-height:1.25; max-height:34px; overflow:hidden;}
.dayCell.today{outline:2px solid var(--ink);}
.today{outline:2px solid var(--ink);}
.bg-주{background:#FBF0D3;} .bg-야{background:#E6E9F5;} .bg-휴{background:#F5F3EC;}
.b-주{background:var(--day); color:#4A3200;} .b-야{background:var(--night);} .b-휴{background:transparent; color:var(--danger); font-size:10px;}
.b-휴가{background:#3BA36A;} .b-대근주간{background:#C026D3;} .b-대근야간{background:#581C87;}
.b-교육{background:#2F6FED;} .b-건강검진{background:#0E93A8;} .b-개인일정{background:#6B7280;}
.dotImp{position:absolute; top:3px; right:4px; font-size:8px; animation:blinkDot 1.1s infinite;}
@keyframes blinkDot{0%,100%{opacity:1;} 50%{opacity:.25;}}

.myTeamChip{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--gold-soft); color:var(--gold-deep);
  padding:10px 14px; border-radius:14px; font-weight:700; font-size:12px; margin-bottom:12px;}
.myTeamChip b{color:var(--ink);}

/* ---------- Bottom sheet modal ---------- */
.sheetOverlay{position:fixed; inset:0; background:rgba(27,42,74,.5); z-index:50; display:none;}
.sheetOverlay.open{display:block;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--surface);
  border-radius:22px 22px 0 0; max-height:85vh; overflow-y:auto; transform:translateY(100%); transition:transform .25s ease;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));}
.sheetOverlay.open .sheet{transform:translateY(0);}
.sheetHandle{width:40px; height:4px; background:var(--border); border-radius:2px; margin:10px auto;}
.sheetHead{display:flex; justify-content:space-between; align-items:center; padding:2px 20px 10px;}
.sheetHead h3{margin:0; font-size:16px;}
.sheetHead button{background:none; border:none; font-size:18px; color:var(--ink-mute);}
.sheetBody{padding:0 20px 10px;}

.segTabs{display:flex; gap:6px; margin:10px 0 14px;}
.segBtn{flex:1; padding:9px; border-radius:10px; border:1px solid var(--border); background:#fff; font-size:12px; font-weight:700; color:var(--ink-soft);}
.segBtn.active{background:var(--ink); color:#fff; border-color:var(--ink);}

.emptyState{text-align:center; padding:30px 10px; color:var(--ink-mute); font-size:13px;}

.setupOverlay{position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; align-items:center; padding:24px;}
.setupBox{width:100%; max-width:400px; margin:0 auto;}
.setupBox h1{font-size:24px; margin:0 0 6px;}
.setupBox p{color:var(--ink-soft); font-size:13px; margin-bottom:20px; line-height:1.6;}
.err{color:var(--danger); font-size:12px; margin-top:6px; min-height:16px;}
</style>
</head>
<body>

<div class="setupOverlay" id="setupOverlay">
  <div class="setupBox">
    <h1>🧭 살림나침반</h1>
    <p>비밀번호를 입력하면 들어갈 수 있어요.</p>
    <div class="field"><label>비밀번호</label><input id="setupKey" type="password" onkeydown="if(event.key==='Enter')doUnlock()"></div>
    <button class="btn btn-gold" onclick="doUnlock()">입장하기</button>
    <div class="err" id="setupErr"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <header class="topbar">
    <div class="brand"><span class="compass">🧭</span><span class="pageTitle" id="pageTitle">홈</span></div>
  </header>
  <div class="scopeBar" id="scopeBar"></div>

  <main>
    <div class="view active" id="view-home"></div>
    <div class="view" id="view-calendar"></div>
    <div class="view" id="view-payroll"></div>
    <div class="view" id="view-ledger"></div>
    <div class="view" id="view-savings"></div>
    <div class="view" id="view-settings"></div>
  </main>

  <nav class="bottomNav">
    <button class="navBtn active" data-v="home" onclick="switchView('home')"><span class="navIcon">🏠</span><span>홈</span></button>
    <button class="navBtn" data-v="calendar" onclick="switchView('calendar')"><span class="navIcon">📅</span><span>캘린더</span></button>
    <button class="navBtn" data-v="payroll" onclick="switchView('payroll')"><span class="navIcon">💰</span><span>급여</span></button>
    <button class="navBtn" data-v="ledger" onclick="switchView('ledger')"><span class="navIcon">📒</span><span>가계부</span></button>
    <button class="navBtn" data-v="savings" onclick="switchView('savings')"><span class="navIcon">🎯</span><span>저축</span></button>
    <button class="navBtn" data-v="settings" onclick="switchView('settings')"><span class="navIcon">⚙️</span><span>설정</span></button>
  </nav>
</div>

<div class="sheetOverlay" id="sheetOverlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <div class="sheetHandle"></div>
    <div class="sheetHead"><h3 id="sheetTitle"></h3><button onclick="closeSheet()">✕</button></div>
    <div class="sheetBody" id="sheetBody"></div>
  </div>
</div>

<script>
/* ================= 설정/연결 ================= */
// 웹앱 URL과 API 키는 고정값으로 박아둠 — 아무도 다시 입력할 필요 없음.
const BAKED_IN_URL = 'https://script.google.com/macros/s/AKfycbyV7YUQU_1u3Vawe0gSC8AB07fE9lbUrT8xI229gj7UD-OOM4sbAIzk113e25C9ETmI/exec';
const BAKED_IN_KEY = 'salim-compass-2026-jh';
const APP_PASSWORD = '1080019jh!'; // 간단한 잠금용 — 이 값 하나만 맞으면 들어옴(대단한 보안이 필요한 앱은 아니라서)

const UNLOCK_KEY = 'salimCompassUnlocked';
const SCOPE_KEY = 'salimCompassScope';
let CFG = { url: BAKED_IN_URL, key: BAKED_IN_KEY };
let PROFILES = [];
let SCOPE = localStorage.getItem(SCOPE_KEY) || 'shared'; // 'shared' | ProfileID

function doUnlock() {
  const pw = document.getElementById('setupKey').value;
  const err = document.getElementById('setupErr');
  if (pw !== APP_PASSWORD) { err.innerText = '비밀번호가 올바르지 않아요.'; return; }
  localStorage.setItem(UNLOCK_KEY, 'yes');
  startApp();
}

// fetch/JSON 파싱이 어떤 이유로든 실패해도 절대 그냥 멈추지 않고, 항상 {success:false, message} 형태로 돌려줌.
// (예전엔 여기서 에러가 나면 화면이 "불러오는 중..."에서 영원히 안 넘어가는 문제가 있었음 — 그 문제를 근본적으로 막는 부분)
async function callApiRaw(url, key, action, args) {
  let res;
  try {
    const u = url + '?action=' + encodeURIComponent(action) + '&key=' + encodeURIComponent(key) + '&args=' + encodeURIComponent(JSON.stringify(args));
    res = await fetch(u);
  } catch (e) {
    return { success: false, message: '네트워크 오류: ' + e.message };
  }
  let text;
  try { text = await res.text(); } catch (e) { return { success: false, message: '응답을 읽지 못했어요.' }; }
  try { return JSON.parse(text); }
  catch (e) { return { success: false, message: '서버 응답이 JSON이 아니에요(배포 재확인 필요): ' + text.slice(0, 150) }; }
}
async function api(action, args = []) {
  try {
    const res = await callApiRaw(CFG.url, CFG.key, action, args);
    if (res && res.success) {
      if (API_CACHE_WRITE_ACTIONS.test(action)) {
        // 방금 쓴 내용이 반영되기 전의 캐시된 화면이 잠깐이라도 먼저 보이는 걸 막기 위해,
        // 쓰기가 성공하면 어떤 조회 캐시가 영향받는지 일일이 따지지 않고 전체를 비운다.
        // (그 다음 조회 1번은 캐시 없이 서버를 기다리게 되지만, 방금 액션을 실행한 직후이니
        // 그 정도 기다림은 자연스럽다 — "내가 방금 한 게 반영 안 됐나?" 하는 혼란보다 낫다.)
        _clearApiCache();
      } else {
        _writeApiCache(action, args, res.data);
      }
    }
    return res;
  }
  catch (e) { return { success: false, message: '알 수 없는 오류: ' + e.message }; }
}

/* ================= API 응답 캐시 (cache-first 렌더링) =================
 * 목적: 화면을 열 때마다 서버 왕복(Apps Script는 구조상 요청당 보통 1초 안팎 걸림)을
 * 눈으로 보며 기다리지 않도록, "마지막으로 성공했던 응답"을 localStorage에 저장해두고
 * 화면을 열자마자 그걸로 먼저 그린 다음, 그 사이 최신 데이터를 백그라운드로 받아와서
 * 다시 그린다. 실제 서버 응답속도는 그대로지만 체감 속도는 크게 좋아진다.
 * - add/update/delete/confirm/apply/close/settle/create/adjust/set/init 로 시작하는
 *   "쓰기" 액션은 절대 캐시하지 않는다 — 데이터 정확성이 걸린 곳은 항상 서버 응답을
 *   그대로 기다린다. 이 캐시는 순수 조회(get/list)에만 쓰인다.
 * - 캐시가 5분보다 오래됐으면 "먼저 보여주는 용도"로도 쓰지 않는다(너무 오래된 값을
 *   먼저 보여줬다가 헷갈리는 것보다는, 그 상황에선 그냥 로딩 표시가 낫다고 판단).
 */
const API_CACHE_PREFIX = 'apiCache:';
const API_CACHE_MAX_AGE_MS = 5 * 60 * 1000;
const API_CACHE_WRITE_ACTIONS = /^(add|update|delete|confirm|cancel|apply|close|settle|create|adjust|set|init)/i;

function _cacheKey(action, args) { return API_CACHE_PREFIX + action + ':' + JSON.stringify(args || []); }

// 캐시에 있는 "최근 성공 응답의 data"를 즉시 돌려준다. 없거나 너무 오래됐으면 null.
function peekApiCache(action, args = []) {
  try {
    const raw = localStorage.getItem(_cacheKey(action, args));
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Date.now() - parsed.ts > API_CACHE_MAX_AGE_MS) return null;
    return parsed.data;
  } catch (e) { return null; }
}

function _writeApiCache(action, args, data) {
  try { localStorage.setItem(_cacheKey(action, args), JSON.stringify({ data: data, ts: Date.now() })); }
  catch (e) { /* 저장공간이 꽉 찼거나 등 — 캐시는 있으면 좋고 없어도 정상 동작해야 하므로 조용히 무시 */ }
}

function _clearApiCache() {
  try {
    Object.keys(localStorage)
      .filter(k => k.indexOf(API_CACHE_PREFIX) === 0)
      .forEach(k => localStorage.removeItem(k));
  } catch (e) { /* 무시 */ }
}

function openOwnerPicker() { /* 이제 상단 스코프바에서 직접 선택 — 더 이상 사용 안 함 */ }
function primaryOwnerId() { var p = PROFILES.find(function (x) { return x.Name === '진한'; }); return p ? p.ProfileID : (PROFILES[0] && PROFILES[0].ProfileID); }
function renderScopeBar() {
  var btns = PROFILES.map(function (p) {
    return '<button class="scopeBtn' + (SCOPE === p.ProfileID ? ' active' : '') + '" data-s="' + p.ProfileID + '" onclick="setScope(\'' + p.ProfileID + '\')">' + p.Name + '</button>';
  }).join('');
  document.getElementById('scopeBar').innerHTML =
    '<button class="scopeBtn' + (SCOPE === 'shared' ? ' active' : '') + '" data-s="shared" onclick="setScope(\'shared\')">공동</button>' + btns;
}
function setScope(s) {
  SCOPE = s; localStorage.setItem(SCOPE_KEY, s);
  renderScopeBar();
  reloadCurrentView();
}

/* ================= 초기화 ================= */
async function startApp() {
  document.getElementById('setupOverlay').style.display = 'none';
  document.getElementById('app').style.display = '';
  const res = await api('listProfiles');
  if (res.success) PROFILES = res.data;
  else { alert('프로필을 불러오지 못했어요: ' + res.message); }
  renderScopeBar();
  switchView('home');
}

if (localStorage.getItem(UNLOCK_KEY) === 'yes') { startApp(); }
else { document.getElementById('setupOverlay').style.display = 'flex'; }

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

/* ================= 공통 유틸 ================= */
function fmtWon(n) { return Math.round(Number(n) || 0).toLocaleString('ko-KR') + '원'; }
function todayYm() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

const TITLES = { home: '홈', calendar: '캘린더', payroll: '급여예측', ledger: '가계부', savings: '저축목표', settings: '설정' };
function switchView(v) {
  document.querySelectorAll('.navBtn').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
  document.getElementById('pageTitle').innerText = TITLES[v];
  reloadCurrentView(v);
}
async function reloadCurrentView(v) {
  v = v || document.querySelector('.navBtn.active').dataset.v;
  try {
    if (v === 'home') await loadHome();
    if (v === 'calendar') await loadCalendar();
    if (v === 'payroll') await loadPayroll();
    if (v === 'ledger') await loadLedger();
    if (v === 'savings') await loadSavings();
    if (v === 'settings') await loadSettings();
  } catch (e) {
    // 어디서든 예상 못한 오류가 나도 "불러오는 중"에 영원히 멈춰있지 않고 에러를 보여줌.
    const el = document.getElementById('view-' + v);

function periodRange(preset) {
  const now = new Date(); let start, end;
  if (preset === 'thisMonth') { start = new Date(now.getFullYear(), now.getMonth(), 1); end = new Date(now.getFullYear(), now.getMonth() + 1, 0); }
  else if (preset === 'lastMonth') { start = new Date(now.getFullYear(), now.getMonth() - 1, 1); end = new Date(now.getFullYear(), now.getMonth(), 0); }
  else if (preset === 'last3') { start = new Date(now.getFullYear(), now.getMonth() - 2, 1); end = new Date(now.getFullYear(), now.getMonth() + 1, 0); }
  else { start = new Date(now.getFullYear(), 0, 1); end = new Date(now.getFullYear(), 11, 31); }
  return [ymd(start), ymd(end)];
}

// 접었다 펼 수 있는 카드. jumpView(있으면) → "자세히 보기"로 해당 탭 이동, jumpSub이면 그 탭 안의 서브탭까지 전환.
function accordionCard(title, id, expanded, bodyHtml, jumpView, jumpSub) {
  const jumpBtn = jumpView ? '<button class="btn-sm btn-ghost" onclick="event.stopPropagation();jumpTo(\'' + jumpView + '\'' + (jumpSub ? ",'" + jumpSub + "'" : '') + ')">자세히</button>' : '';
  return '<div class="card">' +
    '<div class="cardTitle" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleAccordion(\'' + id + '\')">' +
    '<span>' + title + '</span><span style="display:flex;gap:6px;align-items:center;">' + jumpBtn + '<span id="' + id + '-arrow">' + (expanded ? '▾' : '▸') + '</span></span></div>' +
    '<div id="' + id + '" style="display:' + (expanded ? '' : 'none') + ';">' + bodyHtml + '</div></div>';
}
function toggleAccordion(id) {
  const box = document.getElementById(id);
  const arrow = document.getElementById(id + '-arrow');
  const open = box.style.display !== 'none';
  box.style.display = open ? 'none' : '';
  arrow.innerText = open ? '▸' : '▾';
}
function jumpTo(view, sub) {
  switchView(view);
  if (sub === 'budget') setTimeout(() => switchLtView('budget'), 150);
  if (sub === 'exp') setTimeout(() => switchLtView('exp'), 150);
}

// 실시간 예상월급 — 스코프에 맞게: 진한/선영 선택 시 그 사람 것만, 공동이면 둘을 합산.
async function fetchPayrollTicker(primaryPayrollEstimate) {
  const el = document.getElementById('payrollTickerInline');
  if (!el) return;
  const primaryId = primaryOwnerId();
  if (SCOPE !== 'shared' && SCOPE !== primaryId) {
    const args = [SCOPE, todayYm()];
    const cached = peekApiCache('getPayrollEstimate', args);
    if (cached) el.innerHTML = '💰 ' + profileName(SCOPE) + ' 예상 월급 <b>' + fmtWon(cached.estimated) + '</b>';
    const res = await api('getPayrollEstimate', args);
    const amt = res.success ? res.data.estimated : null;
    el.innerHTML = amt !== null ? '💰 ' + profileName(SCOPE) + ' 예상 월급 <b>' + fmtWon(amt) + '</b>' : '';
    return;
  }
  if (SCOPE === 'shared') {
    const others = PROFILES.filter(p => p.ProfileID !== primaryId);
    const otherTotals = await Promise.all(others.map(p => api('getPayrollEstimate', [p.ProfileID, todayYm()])));
    const otherSum = otherTotals.reduce((s, r) => s + (r.success ? r.data.estimated : 0), 0);
    const total = (primaryPayrollEstimate || 0) + otherSum;
    el.innerHTML = '💰 공동 예상 월급 <b>' + fmtWon(total) + '</b>';
    return;
  }
  el.innerHTML = primaryPayrollEstimate !== null && primaryPayrollEstimate !== undefined
    ? '💰 ' + profileName(primaryId) + ' 예상 월급 <b>' + fmtWon(primaryPayrollEstimate) + '</b>' : '';
}
function renderAllTeamsView(shiftsByTeam) {
  const teams = ['A', 'B', 'C', 'D'];
  const dates = Object.keys(shiftsByTeam['A']).sort();
  const lead = new Date(dates[0]).getDay();
  const cells = Array(lead).fill(null).concat(dates);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) { const w = cells.slice(i, i + 7); while (w.length < 7) w.push(null); weeks.push(w); }
  const today = todayStr();
  let html = '<div style="display:grid;grid-template-columns:28px repeat(7,1fr);gap:2px;margin-bottom:6px;">' +
    '<div></div>' + WD.map(w => '<div style="text-align:center;font-size:10px;font-weight:700;color:var(--ink-mute);">' + w + '</div>').join('') + '</div>';
  weeks.forEach(week => {
    html += '<div style="display:grid;grid-template-columns:28px repeat(7,1fr);gap:2px;margin-bottom:2px;">';
    html += '<div></div>' + week.map(d => {
      const isToday = d === today;
      return '<div style="text-align:center;font-size:' + (isToday ? '11px' : '9px') + ';font-weight:' + (isToday ? '900' : '400') + ';color:' + (isToday ? 'var(--gold-deep)' : 'var(--ink-mute)') + ';">' + (d ? Number(d.split('-')[2]) : '') + '</div>';
    }).join('');
    html += '</div>';
    teams.forEach(t => {
      html += '<div style="display:grid;grid-template-columns:28px repeat(7,1fr);gap:2px;margin-bottom:3px;">';
      html += '<div style="font-size:10px;font-weight:800;display:flex;align-items:center;">' + t + '조</div>';
      html += week.map(d => {
        if (!d) return '<div></div>';
        const type = shiftsByTeam[t][d];
        const isToday = d === today;
        const style = isToday
          ? 'height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;box-shadow:0 0 0 2px var(--gold);'
          : 'height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;';
        return '<div style="' + style + '" class="b-' + type + '">' + type + '</div>';
      }).join('');
      html += '</div>';
    });
    html += '<div style="height:1px;background:var(--border);margin:6px 0;"></div>';
  });
  document.getElementById('calAllTeamsView').innerHTML = html;
}
function todayStr() { const t = new Date(); return ymd(t); }
function renderCalGrid(shifts, events) {
  const dates = Object.keys(shifts).sort();
  const lead = new Date(dates[0]).getDay();
  const cells = Array(lead).fill(null).concat(dates);
  const today = todayStr();
  document.getElementById('calGrid').innerHTML = cells.map(dateStr => {
    if (!dateStr) return '<div></div>';
    const type = shifts[dateStr];
    const num = Number(dateStr.split('-')[2]);
    const dayEvents = events.filter(e => e.EventDate === dateStr);
    let badgeCls = 'b-' + type, badgeText = type;
    let important = false;
    let memo = dayEvents.map(e => e.Memo).filter(Boolean).join(', ');
    if (dayEvents.length) {
      important = dayEvents.some(e => String(e.IsImportant) === 'true');
      const swap = dayEvents.find(e => e.Type === '대근');
      const vac = dayEvents.find(e => e.Type === '휴가');
      const pick = swap || vac || dayEvents[0];
      if (pick.Type === '대근') { const night = pick.SwapDirection === '야간'; badgeCls = night ? 'b-대근야간' : 'b-대근주간'; badgeText = night ? '대근(야)' : '대근(주)'; }
      else { badgeCls = 'b-' + pick.Type; badgeText = pick.Type; }
    }
    return '<div class="dayCell bg-' + type + (dateStr === today ? ' today' : '') + '" onclick="openDaySheet(\'' + dateStr + '\')">' +
      '<span class="num">' + num + '</span>' +
      (memo ? '<span class="memo">' + memo + '</span>' : '') +
      '<span class="badge ' + badgeCls + '">' + badgeText + '</span>' +
      (important ? '<span class="dotImp">🔴</span>' : '') + '</div>';
  }).join('');
}

/* ================= 급여예측 ================= */
async function loadPayroll() {
  const el = document.getElementById('view-payroll');
  if (!PROFILES.length) { const r = await api('listProfiles'); if (r.success) PROFILES = r.data; }
  const targets = SCOPE === 'shared' ? PROFILES : PROFILES.filter(p => p.ProfileID === SCOPE);
  el.innerHTML = '<div id="payrollContent" class="muted" style="padding:20px 0;">불러오는 중...</div>';
  const box = document.getElementById('payrollContent');

  // 캐시-먼저: 모든 대상 프로필의 급여 데이터가 캐시에 있으면 즉시 그리고, 백그라운드로 최신값을 받아온다.
  const cachedHtmls = targets.map(p => {
    const cached = peekApiCache('getPayrollPageData', [p.ProfileID, todayYm()]);
    return cached ? renderPayrollCardHtml(p, cached) : null;
  });
  if (cachedHtmls.every(h => h !== null)) box.innerHTML = cachedHtmls.join('');

  const htmls = await Promise.all(targets.map(p => renderPayrollCard(p)));
  box.innerHTML = htmls.join('');
}
async function renderPayrollCard(profile) {
  const res = await api('getPayrollPageData', [profile.ProfileID, todayYm()]);
  if (!res.success) return '<div class="card">오류: ' + res.message + '</div>';
  return renderPayrollCardHtml(profile, res.data);
}
function renderPayrollCardHtml(profile, d) {
  if (d.needsInit) return '<div class="card"><div class="cardTitle">' + profile.Name + '</div><div class="emptyState">급여 설정이 없어요. 설정 탭에서 등록하세요.</div></div>';
  const est = d.estimate;
  const oid = profile.ProfileID;
  const detailId = 'payDetail-' + oid;
  return '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="togglePayDetail(\'' + detailId + '\')">' +
    '<div><div class="cardTitle" style="margin-bottom:2px;">' + profile.Name + '</div><div style="font-size:22px;font-weight:800;">' + fmtWon(est.estimated) + '</div><div class="muted">실수령 추정</div></div>' +
    '<span id="' + detailId + '-arrow" style="font-size:14px;color:var(--ink-mute);">▸ 항목보기</span></div>' +
    '<div id="' + detailId + '" style="display:none;margin-top:12px;border-top:1px solid var(--border);padding-top:10px;">' +
    '<div class="muted" style="margin-bottom:6px;">' + est.periodStart + ' ~ ' + est.periodEnd + ' → ' + est.payMonth + ' 지급</div>' +
    est.lineItems.map(it => {
      const neg = it.amount < 0;
      return '<div class="rowLine"><span' + (neg ? ' style="color:var(--danger);"' : '') + '>' + it.label + '</span><span class="amt"' + (neg ? ' style="color:var(--danger);"' : '') + '>' + (neg ? '-' : '') + fmtWon(Math.abs(it.amount)) + '</span></div>';
    }).join('') +
    '</div>' +
    '<div class="muted" style="margin-top:10px;">' + (d.confirmedSalary ? '이미 확정됨: ' + fmtWon(d.confirmedSalary.ConfirmedAmount) : '이번 달 아직 확정 안 함') + '</div>' +
    '<div class="field"><label>실제 입금액</label><input id="payConfirmAmount-' + oid + '" type="number"></div>' +
    '<button class="btn btn-gold" onclick="submitPayrollConfirm(\'' + oid + '\')">확정 입력</button></div>';
}
function togglePayDetail(id) {
  const box = document.getElementById(id);
  const arrow = document.getElementById(id + '-arrow');
  const open = box.style.display !== 'none';
  box.style.display = open ? 'none' : '';
  arrow.innerText = open ? '▸ 항목보기' : '▾ 접기';
}
async function submitPayrollConfirm(ownerId) {
  const amount = Number(document.getElementById('payConfirmAmount-' + ownerId).value);
  const dRes = await api('getPayrollPageData', [ownerId, todayYm()]);
  const accountId = dRes.success ? dRes.data.defaultPayoutAccountId : '';
  if (!accountId) { alert('먼저 설정 탭에서 기본 급여계좌를 지정해주세요.'); return; }
  const res = await api('confirmSalary', [ownerId, todayYm(), amount, accountId]);
  if (!res.success) { alert('저장 실패: ' + res.message); return; }
  alert('확정 완료: ' + fmtWon(res.data.confirmed));
  loadPayroll();
}

    '<div class="card"><div class="cardTitle">이번 달 지출목표 현황</div><div id="bgList">불러오는 중...</div></div>';
  fetchBudgetStatus();
}
async function fetchBudgetStatus() {
  const res = await api('getBudgetStatus', [todayYm()]);
  const box = document.getElementById('bgList');
  if (!res.success) { box.innerText = '오류: ' + res.message; return; }
  const colorMap = { good: 'var(--success)', warn: '#c98a16', danger: 'var(--danger)' };
  const msgMap = { good: '👍 여유있어요', warn: '⚠️ 한도에 가까워지고 있어요', danger: '🚨 한도 초과!' };
  box.innerHTML = res.data.map(b => {
    const pct = Math.min(100, Math.round(b.Pct * 100));
    const ownerLabel = b.OwnerID === 'shared' ? '공동' : profileName(b.OwnerID);
    return '<div style="margin-bottom:14px;"><div class="rowLine"><span>' + b.Label + ' <span class="muted">(' + ownerLabel + ')</span></span><button class="btn-sm btn-danger" onclick="deleteBudgetM(\'' + b.BudgetID + '\')">삭제</button></div>' +
      '<div class="barTrack"><div class="barFill" style="width:' + pct + '%;background:' + colorMap[b.Status] + ';"></div></div>' +
      '<div class="muted">' + fmtWon(b.Spent) + ' / ' + fmtWon(b.MonthlyLimit) + ' (' + pct + '%) — ' + msgMap[b.Status] + '</div></div>';
  }).join('') || '<div class="emptyState">등록된 지출목표 없음</div>';
}
async function submitBudget() {
  const ids = Array.from(document.querySelectorAll('.bgCatCheck:checked')).map(c => c.value);
  if (!ids.length) { alert('카테고리를 하나 이상 선택하세요.'); return; }
  const res = await api('addBudget', [document.getElementById('bgLabel').value, document.getElementById('bgOwner').value, ids, Number(document.getElementById('bgLimit').value)]);
  if (!res.success) { alert('저장 실패: ' + res.message); return; }
  document.getElementById('bgLabel').value = ''; document.getElementById('bgLimit').value = '';
  document.querySelectorAll('.bgCatCheck:checked').forEach(c => c.checked = false);
  fetchBudgetStatus();
}
async function deleteBudgetM(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  const res = await api('deleteBudget', [id]);
  if (!res.success) { alert(res.message); return; }
  fetchBudgetStatus();
}

let SETTINGS_SUB = 'account';
function loadSettings() {

  el.innerHTML =

    ['account:계좌', 'card:카드', 'category:카테고리', 'leave:휴가코드', 'recurring:고정지출', 'team:근무조'].map(p => {
      const [k, label] = p.split(':');
      return '<button class="segBtn' + (k === SETTINGS_SUB ? ' active' : '') + '" data-sub="' + k + '" style="flex:0 0 auto;padding:8px 14px;" onclick="switchSettingsSub(\'' + k + '\')">' + label + '</button>';

    '<div id="settingsBody"></div>' +
    '<div class="card"><div class="cardTitle">잠금</div>' +

    '<button class="btn btn-danger" onclick="lockApp()">잠금 초기화</button></div>';

function lockApp() {
  if (!confirm('잠글까요? 다음에 열 때 비밀번호를 다시 입력해야 해요.')) return;
  localStorage.removeItem(UNLOCK_KEY);
  location.reload();
}
function switchSettingsSub(k) {
  SETTINGS_SUB = k;
  document.querySelectorAll('#view-settings .segBtn').forEach(b => b.classList.toggle('active', b.dataset.sub === k));
  renderSettingsSub();
}
function renderSettingsSub() {
  if (SETTINGS_SUB === 'account') renderSettingsAccounts();
  if (SETTINGS_SUB === 'card') renderSettingsCards();
  if (SETTINGS_SUB === 'category') renderSettingsCategories();
  if (SETTINGS_SUB === 'leave') renderSettingsLeaveCodes();
  if (SETTINGS_SUB === 'recurring') renderSettingsRecurring();
  if (SETTINGS_SUB === 'team') renderSettingsTeam();
}

let SETTINGS_ACCOUNTS_CACHE = [];
function editAccountM(id) {
  const a = SETTINGS_ACCOUNTS_CACHE.find(x => x.AccountID === id);
  if (!a) return;
  document.getElementById('macc-' + id).innerHTML =
    '<div class="field"><label>이름</label><input id="eAccName-' + id + '" value="' + a.Name.replace(/"/g, '&quot;') + '"></div>' +

async function saveAccountEditM(id) {
  const a = SETTINGS_ACCOUNTS_CACHE.find(x => x.AccountID === id);
  const patch = { Name: document.getElementById('eAccName-' + id).value, Type: document.getElementById('eAccType-' + id).value, Institution: document.getElementById('eAccInst-' + id).value, IsLiability: document.getElementById('eAccLiability-' + id).checked };
  const newBal = Number(document.getElementById('eAccBal-' + id).value);
  const res1 = await api('updateAccount', [id, patch]);
  if (!res1.success) { alert('저장 실패: ' + res1.message); return; }
  const res2 = await api('adjustAccountBalance', [id, a.OwnerID, newBal, '설정에서 직접 보정']);
  if (!res2.success) { alert('잔액 조정 실패: ' + res2.message); return; }
  renderSettingsAccounts();
}

function onCardTypeChangeM() {

async function settleCardM(cardId) {
  const today = new Date().toISOString().substring(0, 10);
  const date = prompt('정산(실제 출금) 날짜를 입력하세요', today);
  if (!date) return;
  const res = await api('settleCard', [cardId, date]);
  if (!res.success) { alert('정산 실패: ' + res.message); return; }
  alert('정산 완료: ' + fmtWon(res.data.Amount));
  renderSettingsCards();
}

  if (!res.success) { alert('실패: ' + res.message); return; }
  renderSettingsCards();
}

async function loadSavings() {

  if (cached) renderSavingsBox(el, cached);
  else el.innerHTML = '<div class="muted" style="padding:20px 0;">불러오는 중...</div>';

  el.innerHTML = '<div class="card"><div class="cardTitle">저축목표</div>' +
    (data.map(g => {
      const pct = Math.min(100, Math.round(g.Progress * 100));
      return '<div style="margin-bottom:14px;"><div class="rowLine"><span>' + g.Name + '</span><span>' + pct + '%</span></div>' +
        '<div class="barTrack"><div class="barFill" style="width:' + pct + '%;background:var(--gold);"></div></div>' +
        '<div class="muted">' + fmtWon(g.CurrentAmount) + ' / ' + fmtWon(g.TargetAmount) + '</div></div>';
    }).join('') || '<div class="emptyState">등록된 목표 없음 — PC 웹앱에서 추가하세요</div>') + '</div>';
}
